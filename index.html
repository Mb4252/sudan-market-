<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - البث الحي</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>سوق السودان</h1>
            <p id="status">جاري التحميل...</p>
        </header>
        <main>
            <section class="search-section">
                <input type="text" id="searchInput" placeholder="ابحث عن منشورات...">
                <button id="searchBtn">بحث</button>
            </section>
            <section class="filter-section">
                <input type="text" id="cityFilter" placeholder="المدينة">
                <input type="number" id="minPriceFilter" placeholder="أدنى سعر">
                <input type="number" id="maxPriceFilter" placeholder="أعلى سعر">
                <input type="date" id="startDateFilter">
                <input type="date" id="endDateFilter">
                <button id="filterBtn">تصفية</button>
            </section>
            <section class="stats-section">
                <div class="stat">
                    <span>إجمالي المنشورات:</span>
                    <span id="totalPosts">0</span>
                </div>
                <div class="stat">
                    <span>متوسط السعر:</span>
                    <span id="avgPrice">0</span>
                </div>
                <div class="stat">
                    <span>أدنى سعر:</span>
                    <span id="minPrice">0</span>
                </div>
                <div class="stat">
                    <span>أعلى سعر:</span>
                    <span id="maxPrice">0</span>
                </div>
            </section>
            <section class="posts-section" id="postsContainer">
                <!-- المنشورات ستظهر هنا -->
            </section>
        </main>
        <footer>
            <button id="publishBtn">نشر منشور جديد</button>
            <button id="compareBtn">مقارنة الأسعار</button>
        </footer>
    </div>
    <script src="store/post-store.js"></script>
    <script src="sync/render-socket.js"></script>
    <script src="analytics/filter-engine.js"></script>
    <script src="analytics/market-stats.js"></script>
    <script src="app.js"></script>
</body>
</html>
