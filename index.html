<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-chat-ui.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان - واجهة SDM</h1>
        </div>

        <div id="sdm-chat" class="chat-container"></div>
        <input type="text" id="sdm-name" placeholder="أدخل هويتك للدردشة" class="input-field">
        <input type="text" id="sdm-message" placeholder="اكتب رسالتك أو اسأل عن سعر سلعة" class="input-field">
        <button id="sdm-send-btn" class="send-button" type="button">إرسال</button>
        <div id="connection-status" class="connection-status">غير متصل</div>

        <!-- مؤشر الأسعار اليومي -->
        <div id="sdm-price-box" class="price-box">
            <input type="text" id="price-item-input" placeholder="اسم السلعة (مثال: سكر)" class="input-field">
            <input type="number" id="price-value-input" placeholder="السعر" class="input-field">
            <input type="text" id="price-area-input" placeholder="المنطقة / الحي" class="input-field">
            <button id="price-add-btn" class="send-button" type="button">حفظ السعر</button>
            <div id="sdm-price-list" class="price-list"></div>
        </div>

        <!-- تضمين ملفات JS مع defer وحماية داخل الوحدات -->
        <script src="public/core/dom-date-guard.js" defer></script>
        <script src="public/core/local-posts-store.js" defer></script>
        <script src="public/core/render-stream.js" defer></script>
        <script src="public/sdm/sdm-mobile-layout.js" defer></script>
        <script src="public/sdm/sdm-chat-sender-66.js" defer></script>
        <script src="public/sdm/sdm-module-67.js" defer></script>
        <script src="public/sdm/sdm-module-71.js" defer></script>
        <script src="public/sdm/sdm-module-72.js" defer></script>
        <script src="public/sdm/sdm-price-tracker.js" defer></script>
        <script src="public/sdm/sdm-price-ui.js" defer></script>
    </div>
</body>
</html>
