<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - البث الحي</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <h1>سوق السودان</h1>
            <div id="status">متصل</div>
        </header>
        <main>
            <div id="posts-container"></div>
            <div id="radar-container">
                <h2>رادار الأسعار</h2>
                <div id="price-trends"></div>
                <div id="average-price"></div>
            </div>
            <div id="compare-container">
                <h2>مقارنة العروض</h2>
                <div id="best-offers"></div>
            </div>
            <button id="publishBtn">نشر منشور</button>
            <button id="compareBtn">مقارنة العروض</button>
        </main>
    </div>
    <script src="app.js"></script>
    <script src="radar/price-extractor.js"></script>
    <script src="radar/compare-engine.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // تحديث رادار الأسعار
            function updateRadar(posts) {
                const prices = window.priceExtractor.extractPrices(posts);
                const averagePrice = window.priceExtractor.calculateAveragePrice(prices);
                const trends = window.priceExtractor.analyzePriceTrends(posts);

                document.getElementById('average-price').textContent = `متوسط السعر: ${averagePrice.toFixed(2)}`;
                document.getElementById('price-trends').textContent = `اتجاه الأسعار: ${trends.trend} (ثقة: ${(trends.confidence * 100).toFixed(0)}%)`;
            }

            // تحديث مقارنة العروض
            function updateCompare(posts) {
                const bestOffers = window.compareEngine.compareOffers(posts);
                const bestOffersContainer = document.getElementById('best-offers');
                bestOffersContainer.innerHTML = '';

                bestOffers.forEach(offer => {
                    const offerElement = document.createElement('div');
                    offerElement.className = 'offer';
                    offerElement.innerHTML = `
                        <h3>${offer.author}</h3>
                        <p>${offer.content}</p>
                        <p>سعر: ${offer.price}</p>
                        <p>مدينة: ${offer.city}</p>
                    `;
                    bestOffersContainer.appendChild(offerElement);
                });
            }

            // تحديث الواجهة عند تحديث المخزن
            window.store.on('storeUpdated', function(e) {
                const { posts } = e.detail;
                updateRadar(posts);
                updateCompare(posts);
            });
        });
    </script>
</body>
</html>
