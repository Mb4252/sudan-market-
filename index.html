<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان</title>
    <link rel="stylesheet" href="public/styles.css">
</head>
<body>
    <div id="filters">
        <div class="filter-section">
            <label for="searchInput">بحث:</label>
            <input type="text" id="searchInput" placeholder="بحث عن منتج أو مدينة">
        </div>
        <div class="filter-section">
            <label>تحديد سعر:</label>
            <input type="range" id="priceRangeSlider" min="0" max="10000" value="10000" class="slider">
            <div id="priceRangeValues">من: <span id="minPrice">0</span> إلى: <span id="maxPrice">10000</span></div>
        </div>
        <div class="filter-section">
            <label for="cityFilter">مدينة:</label>
            <select id="cityFilter">
                <option value="">كل المدن</option>
                <option value="الخرطوم">الخرطوم</option>
                <option value="أتمنة">أتمنة</option>
                <option value="درب فور">درب فور</option>
                <option value="وادي حلفا">وادي حلفا</option>
            </select>
        </div>
    </div>
    
    <div id="postsContainer"></div>
    
    <div id="analyticsContainer"></div>
    
    <script src="public/api.js"></script>
    <script src="public/filters.js"></script>
    <script src="public/analytics.js"></script>
    <script src="public/app.js"></script>
</body>
</html>
