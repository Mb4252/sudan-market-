<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة عصرية</title>
    <link rel="stylesheet" href="public/styles.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>سوق السودان</h1>
            <div class="status-bar" id="statusBar">
                <span id="status">متصل</span>
                <span id="broadcastStatus">بث مباشر</span>
            </div>
        </header>

        <main class="app-main">
            <section class="quick-publish">
                <h2>نشر فوري</h2>
                <div class="publish-form">
                    <input type="text" id="authorInput" placeholder="اسمك" required>
                    <input type="text" id="contentInput" placeholder="وصف المنتج" required>
                    <input type="number" id="priceInput" placeholder="السعر" required>
                    <select id="cityInput" required>
                        <option value="">اختر المدينة</option>
                        <option value="الخرطوم">الخرطوم</option>
                        <option value="أم درمان">أم درمان</option>
                        <option value="بورتسودان">بورتسودان</option>
                        <option value="كردفان">كردفان</option>
                        <option value="دارفور">دارفور</option>
                    </select>
                    <button id="publishBtn">نشر</button>
                </div>
            </section>

            <section class="posts-container" id="postsContainer">
                <!-- المنشورات ستظهر هنا -->
            </section>

            <section class="radar-container">
                <h2>رادار الأسعار</h2>
                <div id="radarChart"></div>
            </section>

            <section class="compare-container">
                <h2>مقارنة الأسعار</h2>
                <button id="compareBtn">مقارنة</button>
                <div id="compareResults"></div>
            </section>
        </main>

        <footer class="app-footer">
            <p>سوق السودان © 2023</p>
        </footer>
    </div>

    <script src="public/store.js"></script>
    <script src="public/api.js"></script>
    <script src="public/broadcast.js"></script>
    <script src="public/radar.js"></script>
    <script src="public/compare.js"></script>
    <script src="public/app.js"></script>
</body>
</html>
