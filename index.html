<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-addon-24.css">
    <script src="public/core/dom-date-guard.js"></script>
    <script src="public/core/local-posts-store.js"></script>
    <script src="public/core/render-stream.js"></script>
    <script src="public/sdm/sdm-storage.js"></script>
    <script src="public/sdm/sdm-engine.js"></script>
    <script src="public/sdm/sdm-chat-ui.js"></script>
    <script src="public/sdm/sdm-render-sync.js"></script>
    <script src="public/sdm/sdm-shell.js"></script>
    <script src="public/sdm/sdm-commands.js"></script>
    <script src="public/sdm/sdm-addon-24.js"></script>
    <script src="public/sdm/sdm-addon-25.js"></script>
    <script src="public/sdm/sdm-addon-26.js"></script>
    <script src="public/sdm/sdm-addon-27.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .chat-container {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            background-color: white;
        }
        .message-input {
            width: calc(100% - 22px);
            padding: 10px;
            margin-top: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .send-button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .connection-status {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9em;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان</h1>
            <p>واجهة SDM</p>
        </div>
        <div id="chat-container" class="chat-container">
            <!-- الرسائل ستظهر هنا -->
        </div>
        <input type="text" id="message-input" class="message-input" placeholder="اكتب رسالتك...">
        <button id="send-button" class="send-button">إرسال</button>
        <div id="connection-status" class="connection-status">متصل</div>
    </div>
</body>
</html>
