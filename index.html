<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - البث الحي</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
    <style>
        .live5-container {
            background-color: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
        }
        .status-dot.online {
            background-color: #4CAF50;
        }
        .status-dot.offline {
            background-color: #F44336;
        }
        .live5-stats {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }
        .live5-list {
            list-style-type: none;
            padding: 0;
        }
        .live5-list li {
            padding: 5px 0;
            border-bottom: 1px solid #ddd;
        }
    </style>
</head>
<body>
    <div class="live5-container">
        <h2>البث الحي</h2>
        <div class="live5-status">
            <span id="live5-status-dot" class="status-dot offline"></span>
            <span id="live5-status-text">غير متصل</span>
        </div>
        <div class="live5-stats">
            <div>عدد المنشورات: <span id="live5-posts-count">0</span></div>
            <div>عدد المدن: <span id="live5-cities-count">0</span></div>
            <div>آخر تحديث: <span id="live5-last-sync">غير متاح</span></div>
        </div>
        <div class="live5-content">
            <h3>المدن</h3>
            <ul id="live5-cities-list" class="live5-list"></ul>
            <h3>آخر المنشورات</h3>
            <ul id="live5-posts-list" class="live5-list"></ul>
        </div>
    </div>
    <script src="modules/live-5-ui.js"></script>
    <script src="modules/live-5-logic.js"></script>
</body>
</html>
