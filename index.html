<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نشر مباشر بقاعدة بيانات المتصفح</title>
  <link rel="stylesheet" href="public/style.css"/>
</head>
<body>
  <div class="card">
    <div id="status" class="status">جاري الاتصال بـ Render...</div>
    <div id="serverTime" class="status"></div>
    <input id="author" type="text" placeholder="اسمك (اختياري)" maxlength="40"/>
    <textarea id="content" rows="3" placeholder="اكتب ما تريد نشره للآخرين..."></textarea>
    <button id="publishBtn" type="button">نشر للآخرين وحفظ في متصفحي</button>
  </div>
  <div class="card filter-card">
    <button class="filter-btn" data-filter="">عرض كل</button>
    <button class="filter-btn" data-filter="cheap">عرض رخيص</button>
    <button class="filter-btn" data-filter="expensive">عرض غالي</button>
  </div>
  <div class="card" id="priceRadar">
    <h3>ملخص الأسعار</h3>
    <div id="radarContent">جارٍ التحميل...</div>
    <button id="compareBtn" type="button">قارن الأسعار</button>
  </div>
  <div class="card">
    <h3>المنشورات (محفوظة في متصفحك فقط)</h3>
    <div id="posts"></div>
  </div>
  <script src="public/utils.js"></script>
  <script src="public/priceWasm.js"></script>
  <script src="public/price.js"></script>
  <script src="public/filter.js"></script>
  <script src="public/priceRadar.js"></script>
  <script src="public/priceTrend.js"></script>
  <script src="public/priceAlert.js"></script>
  <script src="public/compare.js"></script>
  <script src="public/script.js"></script>
  <script src="public/theme.js"></script>
  <script src="public/storage.js"></script>
  <script src="public/priceEngine.js"></script>
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').then(r=>console.log('SW registered',r)).catch(e=>console.error('SW fail',e));
    }
  </script>
  <script>
    (function(){
      const serverUrl='wss://example.com/socket';
      let socket=null;
      function connect(){
        socket=new WebSocket(serverUrl);
        socket.onopen=()=>{console.log('WebSocket connected');};
        socket.onclose=()=>{console.log('WebSocket closed, retrying'); setTimeout(connect,3000);};
        socket.onerror=()=>{socket.close();};
      }
      connect();
      window.sendMessage=data=>{
        if(socket && socket.readyState===WebSocket.OPEN){
          socket.send(JSON.stringify(data));
        }else{
          fetch('/longpoll', {method:'POST',body:JSON.stringify(data)});
        }
      };
    })();
  </script>
</body>
</html>
