<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نشر مباشر بقاعدة بيانات المتصفح</title>
  <link rel="stylesheet" href="public/style.css"/>
</head>
<body>
  <div class="card">
    <div id="status" class="status">جاهز</div>
    <input id="author" type="text" placeholder="اسمك (اختياري)" maxlength="40"/>
    <textarea id="content" rows="3" placeholder="اكتب ما تريد نشره للآخرين..."></textarea>
    <button id="publishBtn" type="button">نشر للآخرين وحفظ في متصفحي</button>
  </div>
  <div class="card filter-card">
    <button class="filter-btn" data-filter="">عرض كل</button>
    <button class="filter-btn" data-filter="cheap">عرض رخيص</button>
    <button class="filter-btn" data-filter="expensive">عرض غالي</button>
  </div>
  <div class="card" id="priceRadar">
    <h3>ملخص الأسعار</h3>
    <div id="radarContent">جارٍ التحميل...</div>
    <button id="compareBtn" type="button">قارن الأسعار</button>
  </div>
  <div class="card">
    <h3>المنشورات (محفوظة في متصفحك فقط)</h3>
    <div id="posts"></div>
  </div>
  <script src="public/config.js"></script>
  <script src="public/priceEngine.js"></script>
  <script src="public/storage.js"></script>
  <script src="public/broadcast.js"></script>
  <script src="public/filter.js"></script>
  <script src="public/priceRadar.js"></script>
  <script src="public/compare-modal.js"></script>
  <script src="public/compare.js"></script>
  <script>
    (function(){
      const statusEl = document.getElementById('status');
      function setStatus(msg, isError){
        statusEl.textContent = msg;
        statusEl.classList.toggle('error', !!isError);
      }
      window.addEventListener('error', function(e){
        setStatus('خطأ: ' + (e.message || 'غير معروف'), true);
      });
      window.addEventListener('unhandledrejection', function(){
        setStatus('خطأ غير معالج', true);
      });

      const publishBtn = document.getElementById('publishBtn');
      const authorInput = document.getElementById('author');
      const contentInput = document.getElementById('content');
      const compareBtn = document.getElementById('compareBtn');

      publishBtn.addEventListener('click', function(){
        const author = authorInput.value.trim() || 'مجهول';
        const content = contentInput.value.trim();
        if (!content) { setStatus('الرجاء كتابة نص المنشور', true); return; }
        try {
          window.publishPost({ id: Date.now(), author: author, content: content, timestamp: Date.now() });
          contentInput.value = '';
          setStatus('تم النشر والحفظ');
        } catch (err) {
          console.error(err);
          setStatus('تعذر النشر', true);
        }
      });

      compareBtn.addEventListener('click', function(){
        try {
          window.openCompare();
        } catch (err) {
          console.error(err);
          setStatus('تعذر فتح المقارنة', true);
        }
      });
    })();
  </script>
</body>
</html>
