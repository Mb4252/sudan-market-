<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نشر مباشر بقاعدة بيانات المتصفح</title>
  <link rel="stylesheet" href="public/style.css"/>
</head>
<body>
  <div class="card">
    <div id="status" class="status">جاري الاتصال بـ Render...</div>
    <div id="serverTime" class="status"></div>
    <input id="author" type="text" placeholder="اسمك (اختياري)" maxlength="40"/>
    <textarea id="content" rows="3" placeholder="اكتب ما تريد نشره للآخرين..."></textarea>
    <button id="publishBtn" type="button">نشر للآخرين وحفظ في متصفحي</button>
  </div>
  <div class="card filter-card">
    <button class="filter-btn" data-filter="">عرض كل</button>
    <button class="filter-btn" data-filter="cheap">عرض رخيص</button>
    <button class="filter-btn" data-filter="expensive">عرض غالي</button>
  </div>
  <div class="card" id="priceRadar">
    <h3>ملخص الأسعار</h3>
    <div id="radarContent">جارٍ التحميل...</div>
    <button id="compareBtn" type="button">قارن الأسعار</button>
  </div>
  <div class="card">
    <h3>المنشورات (محفوظة في متصفحك فقط)</h3>
    <div id="posts"></div>
  </div>
  <script src="public/utils.js"></script>
  <script src="public/priceWasm.js"></script>
  <script src="public/price.js"></script>
  <script src="public/filter.js"></script>
  <script src="public/priceRadar.js"></script>
  <script src="public/priceTrend.js"></script>
  <script src="public/priceAlert.js"></script>
  <script src="public/compare.js"></script>
  <script src="public/theme.js"></script>
  <script src="public/storage.js"></script>
  <script src="public/priceEngine.js"></script>
  <script src="public/config.js"></script>
  <script>
    if('serviceWorker' in navigator){
      navigator.serviceWorker.register('sw.js').then(r=>console.log('SW registered',r)).catch(e=>console.error('SW fail',e));
    }
  </script>
  <script>
    (function(){
      const serverUrl = (window.APP_CONFIG && window.APP_CONFIG.wsUrl) || 'wss://example.com/socket';
      let socket = null;
      let retryDelay = 500;
      const maxDelay = 30000;

      function connect(){
        try{
          socket = new WebSocket(serverUrl);
          socket.onopen = () => {
            console.log('WebSocket connected');
            retryDelay = 500;
            const statusEl = document.getElementById('status');
            if(statusEl) statusEl.textContent = 'متصل';
          };
          socket.onmessage = e => {
            try {
              const data = JSON.parse(e.data);
              if(data.type === 'NEW_POST') {
                window.publishPost(data);
              }
            } catch(err) { console.error('WS parse error', err); }
          };
          socket.onclose = () => {
            const statusEl = document.getElementById('status');
            if(statusEl) statusEl.textContent = 'غير متصل، إعادة المحاولة...';
            setTimeout(connect, retryDelay);
            retryDelay = Math.min(retryDelay * 2, maxDelay);
          };
          socket.onerror = () => {
            const statusEl = document.getElementById('status');
            if(statusEl) statusEl.textContent = 'خطأ في الاتصال';
          };
        }catch(err){
          console.error('WebSocket error', err);
          setTimeout(connect, retryDelay);
          retryDelay = Math.min(retryDelay * 2, maxDelay);
        }
      }

      connect();

      const publishBtn = document.getElementById('publishBtn');
      if(publishBtn){
        publishBtn.addEventListener('click', () => {
          const author = document.getElementById('author').value.trim() || 'مجهول';
          const content = document.getElementById('content').value.trim();
          if(!content) return;
          
          const post = {
            author: author,
            content: content,
            timestamp: Date.now()
          };

          // حفظ محلي
          const stored = JSON.parse(localStorage.getItem(window.APP_CONFIG.storageKey) || '[]');
          stored.unshift(post);
          localStorage.setItem(window.APP_CONFIG.storageKey, JSON.stringify(stored));

          // بث محلي وعبر WebSocket
          window.publishPost(post);
          if(socket && socket.readyState === WebSocket.OPEN){
            socket.send(JSON.stringify({ type: 'NEW_POST', ...post }));
          }

          document.getElementById('content').value = '';
        });
      }

      // عرض المنشورات المحفوظة
      function renderPosts(){
        const postsDiv = document.getElementById('posts');
        if(!postsDiv) return;
        const stored = JSON.parse(localStorage.getItem(window.APP_CONFIG.storageKey) || '[]');
        postsDiv.innerHTML = '';
        stored.forEach(p => {
          const div = document.createElement('div');
          div.className = 'post ' + (p.priceTag || '');
          div.dataset.timestamp = p.timestamp;
          div.innerHTML = `<div class="meta">${p.author || 'مجهول'} — ${new Date(p.timestamp).toLocaleString()}</div><div>${p.content}</div>`;
          postsDiv.appendChild(div);
        });
        window.applyFilter && window.applyFilter(window.currentFilter);
      }

      renderPosts();
    })();
  </script>
</body>
</html>
