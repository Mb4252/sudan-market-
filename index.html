<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>نشر مباشر بقاعدة بيانات المتصفح</title>
  <style>
    body {font-family: Tahoma, Arial, sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; background: #f5f6f8;}
    .card {background: #fff; padding: 16px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;}
    input, textarea, button {width: 100%; box-sizing: border-box; margin-top: 8px; padding: 10px; border-radius: 8px; border: 1px solid #d0d7de; font-family: inherit;}
    button {background: #1f6feb; color: #fff; border: none; font-weight: bold; cursor: pointer;}
    .post {border-bottom: 1px solid #eef2f6; padding: 10px 0;}
    .meta {font-size: 12px; color: #656d76; margin-bottom: 4px;}
    .status {font-size: 13px; margin-bottom: 10px; color: #0969da;}
  </style>
</head>
<body>
  <div class="card">
    <div id="status" class="status">جاري الاتصال بـ Render...</div>
    <div id="serverTime" class="status"></div>
    <input id="author" type="text" placeholder="اسمك (اختياري)" maxlength="40" />
    <textarea id="content" rows="3" placeholder="اكتب ما تريد نشره للآخرين..."></textarea>
    <button id="publishBtn" type="button">نشر للآخرين وحفظ في متصفحي</button>
  </div>

  <div class="card">
    <h3>المنشورات (محفوظة في متصفحك فقط)</h3>
    <div id="posts"></div>
  </div>

  <script>
    const STORAGE_KEY = 'user_browser_posts_v1';
    const WS_URL = location.hostname === 'localhost'
      ? `ws://${location.host}`
      : `wss://${location.hostname}`;

    const statusEl = document.getElementById('status');
    const serverTimeEl = document.getElementById('serverTime');
    const authorEl = document.getElementById('author');
    const contentEl = document.getElementById('content');
    const publishBtn = document.getElementById('publishBtn');
    const postsEl = document.getElementById('posts');

    function getLocalPosts() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); }
      catch { return []; }
    }

    function saveLocalPost(post) {
      const posts = getLocalPosts();
      posts.unshift(post);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts.slice(0, 200)));
      renderPosts();
    }

    function renderPosts() {
      const posts = getLocalPosts();
      postsEl.innerHTML = posts.map(p => `
        <div class="post">
          <div class="meta">${escapeHtml(p.author || 'مستخدم')} — ${escapeHtml(p.timestamp || '')}</div>
          <div>${escapeHtml(p.content || '')}</div>
        </div>
      `).join('') || '<p>لا توجد منشورات محفوظة في المتصفح بعد.</p>';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function updateOnlineCount() {
      fetch('/stats')
        .then(r => r.json())
        .then(data => {
          const count = data.connectedClients || 0;
          const base = socket && socket.readyState === WebSocket.OPEN ? 'متصل بـ Render' : 'جاري الاتصال بـ Render';
          statusEl.textContent = `${base} — المتصلون الآن: ${count}`;
        })
        .catch(() => {});
    }

    let socket;
    function connect() {
      socket = new WebSocket(WS_URL);
      socket.onopen = () => {
        updateOnlineCount();
      };
      socket.onclose = () => {
        statusEl.textContent = 'انقطع الاتصال، جاري إعادة المحاولة...';
        setTimeout(connect, 2500);
      };
      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.type === 'post') {
            saveLocalPost(data);
            updateOnlineCount();
          } else if (data.type === 'system' && data.timestamp) {
            const time = new Date(data.timestamp).toLocaleTimeString();
            serverTimeEl.textContent = `وقت الخادم: ${time}`;
          }
        } catch {}
      };
    }

    // Periodic refresh of online count
    setInterval(updateOnlineCount, 10000);

    publishBtn.addEventListener('click', () => {
      const text = contentEl.value.trim();
      if (!text) return;

      const msg = {
        author: authorEl.value.trim() || 'مستخدم',
        content: text,
        timestamp: new Date().toISOString()
      };

      // حفظ محلي
      saveLocalPost(msg);

      // إرسال للآخرين عبر WebSocket
      if (socket && socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify(msg));
      }

      contentEl.value = '';
    });

    renderPosts();
    connect();
  </script>
</body>
</html>
