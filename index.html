<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-chat-ui.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان - واجهة SDM</h1>
        </div>
        <div id="sdm-chat" class="chat-container"></div>
        <input type="text" id="sdm-name" placeholder="أدخل هويةك للدردشة" class="input-field">
        <input type="text" id="sdm-message" placeholder="اكتب رسالتك" class="input-field">
        <button id="sdm-send-btn" class="send-button">إرسال</button>
        <div id="connection-status" class="connection-status">غير متصل</div>
        <div id="user-settings" class="user-settings">
            <label for="theme-selector">الوضع:</label>
            <select id="theme-selector">
                <option value="light">فاتح</option>
                <option value="dark">داكن</option>
            </select>
            <label for="notifications-toggle">التنبيهات:</label>
            <input type="checkbox" id="notifications-toggle">
        </div>

        <!-- تضمين ملفات JS مع try/catch و defer -->
        <script src="public/core/dom-date-guard.js"></script>
        <script src="public/core/local-posts-store.js"></script>
        <script src="public/core/render-stream.js"></script>
        <script src="public/sdm/sdm-mobile-layout.js" defer></script>
        <script src="public/sdm/sdm-chat-sender-66.js" defer></script>
        <script src="public/sdm/sdm-module-67.js" defer></script>
        <script src="public/sdm/sdm-module-72.js" defer></script>
        <script src="public/sdm/sdm-module-77.js" defer></script>
        <script src="public/sdm/sdm-module-81.js" defer></script>
    </div>
</body>
</html>
