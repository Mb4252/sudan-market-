    <link rel="stylesheet" href="public/sdm/sdm-chat-ui.css">
    <style>
        .user-settings {
            margin: 10px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .user-settings label {
            margin-right: 10px;
        }
        body.light {
            background-color: #ffffff;

        body.dark {

        <input type="text" id="sdm-name" placeholder="أدخل هويةك للدردشة" class="input-field">

        <button id="sdm-send-btn" class="send-button">إرسال</button>
        <div id="connection-status" class="connection-status">غير متصل</div>
        <div id="user-settings" class="user-settings">
            <label for="theme-selector">الوضع:</label>
            <select id="theme-selector">

                <option value="dark">داكن</option>
