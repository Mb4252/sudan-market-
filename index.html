<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-chat-ui.css">
    <style>
        .user-settings {
            margin: 10px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .user-settings label {
            margin-right: 10px;
        }
        body.light {
            background-color: #ffffff;
            color: #000000;
        }
        body.dark {
            background-color: #121212;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان - واجهة SDM</h1>
        </div>
        <div id="sdm-chat" class="chat-container"></div>
        <input type="text" id="sdm-name" placeholder="أدخل هويةك للدردشة" class="input-field">
        <input type="text" id="sdm-message" placeholder="اكتب رسالتك" class="input-field">
        <button id="sdm-send-btn" class="send-button">إرسال</button>
        <div id="connection-status" class="connection-status">غير متصل</div>
        <div id="user-settings" class="user-settings">
            <label for="theme-selector">الوضع:</label>
            <select id="theme-selector">
                <option value="light">مضيء</option>
                <option value="dark">داكن</option>
            </select>
        </div>
    </div>
    <script src="public/sdm/sdm-module-145.js" defer></script>
    <script src="public/sdm/sdm-chat-ui.js" defer></script>
    <script src="public/core/render-stream.js" defer></script>
</body>
</html>
