<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>سوق السودان</title>
  <link rel="stylesheet" href="public/styles.css">
  <link rel="manifest" href="public/manifest.json">
</head>
<body>
  <div class="container">
    <header>
      <h1>سوق السودان</h1>
      <button id="theme-toggle" class="btn">تبديل الثيم</button>
    </header>
    <main>
      <section class="card">
        <h2>نشر منشور جديد</h2>
        <form id="post-form">
          <div class="form-group">
            <label for="city">المدينة:</label>
            <input type="text" id="city" required>
          </div>
          <div class="form-group">
            <label for="item">المنتج:</label>
            <input type="text" id="item" required>
          </div>
          <div class="form-group">
            <label for="price">السعر:</label>
            <input type="number" id="price" required>
          </div>
          <button type="submit" class="btn">نشر</button>
        </form>
      </section>
      <section class="card">
        <h2>المنشورات الأخيرة</h2>
        <div id="posts-container"></div>
      </section>
      <section class="card">
        <h2>الرادار</h2>
        <div id="radar-container"></div>
      </section>
    </main>
    <footer>
      <p>© 2023 سوق السودان. جميع الحقوق محفوظة.</p>
    </footer>
  </div>
  <script src="public/app.js"></script>
  <script src="public/storage.js"></script>
  <script src="public/websocket.js"></script>
</body>
</html>
