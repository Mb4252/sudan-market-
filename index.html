<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <h1>سوق السودان</h1>
            <div id="status" class="badge badge-loading">جارِ التحميل...</div>
        </header>
        <main>
            <section class="post-form">
                <input type="text" id="author" placeholder="اسمك">
                <textarea id="content" placeholder="نشر منشور جديد"></textarea>
                <button id="postBtn">نشر</button>
            </section>
            <section class="posts-container">
                <div id="postsList"></div>
            </section>
            <section class="charts-container">
                <div class="chart">
                    <canvas id="chartVolume"></canvas>
                </div>
                <div class="chart">
                    <canvas id="chartPrice"></canvas>
                </div>
            </section>
            <section class="radar-container">
                <div id="radarContent"></div>
            </section>
        </main>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="app.js"></script>
    <script src="api.js"></script>
</body>
</html>
