<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
            text-align: right;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        #sdm-chat {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            height: 400px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        #user-identity {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
        }
        #message-input {
            width: 70%;
            padding: 8px;
        }
        #send-button {
            width: 25%;
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        #connection-status {
            text-align: center;
            margin-top: 10px;
            padding: 5px;
            background-color: #f0f0f0;
        }
    </style>
</head>

    <div class="container">
        <div class="header">

            <h2>واجهة SDM</h2>
        </div>
        <div id="connection-status">غير متصل</div>
        <input type="text" id="user-identity" placeholder="أدخل هويةك">
        <div id="sdm-chat"></div>
        <input type="text" id="message-input" placeholder="اكتب رسالتك...">
        <button id="send-button">إرسال</button>
    </div>
