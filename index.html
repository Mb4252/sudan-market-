<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - البث الحي</title>
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>سوق السودان</h1>
        </header>
        <div class="live-status" id="status">بث حي نشط</div>
        <div class="post-form">
            <h2>نشر منشور جديد</h2>
            <div>
                <label for="author">المؤلف:</label>
                <input type="text" id="author" placeholder="اسمك">
            </div>
            <div>
                <label for="content">المحتوى:</label>
                <textarea id="content" placeholder="وصف المنتج"></textarea>
            </div>
            <div>
                <label for="price">السعر:</label>
                <input type="number" id="price" placeholder="السعر">
            </div>
            <div>
                <label for="city">المدينة:</label>
                <input type="text" id="city" placeholder="المدينة">
            </div>
            <button id="publishBtn">نشر</button>
        </div>
        <div class="actions">
            <button id="compareBtn">مقارنة الأسعار</button>
            <button id="radarBtn">خريطة الرادار</button>
        </div>
        <div id="postsContainer"></div>
    </div>
    <script src="app.js"></script>
    <script src="api.js"></script>
    <script src="store/post-store.js"></script>
    <script src="sync/render-socket.js"></script>
</body>
</html>
