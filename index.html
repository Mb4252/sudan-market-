<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>رادار أسعار الحي</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #eef5f0;
      color: #0f172a;
    }
  </style>
</head>
<body class="min-h-screen pb-20">

  <!-- شريط علوي نظيف ومختصر -->
  <header class="sticky top-0 z-30 bg-[#e4f0e8]/95 backdrop-blur border-b border-emerald-900/10">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-10 h-10 rounded-full bg-white border border-emerald-700/20 flex items-center justify-center text-lg shrink-0">
          🌾
        </div>
        <div class="min-w-0">
          <h1 class="text-base font-extrabold text-slate-900 leading-tight truncate">رادار أسعار الحي</h1>
          <div class="flex items-center gap-2 mt-0.5 text-[11px] font-bold text-slate-700">
            <span class="inline-flex items-center gap-1 truncate">
              <span id="relayDot" class="w-2 h-2 rounded-full bg-amber-500 inline-block shrink-0"></span>
              <span id="relayStatus" class="truncate">جاري الربط...</span>
            </span>
            <span id="onlineCountBadge" class="text-[10px] font-extrabold bg-white text-[#1b7a43] border border-emerald-700/20 px-2 py-0.5 rounded-full shrink-0">
              متصل: 1
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <button
          onclick="openProfileModal()"
          class="bg-white hover:bg-slate-50 text-slate-800 border border-slate-300 text-xs font-bold px-2.5 py-2 rounded-xl transition"
        >
          حسابي
        </button>
        <button
          onclick="openAddModal()"
          class="bg-[#1b7a43] hover:bg-[#156235] active:scale-95 text-white text-xs font-extrabold px-3 py-2 rounded-xl transition"
        >
          + نشر سعر
        </button>
      </div>
    </div>

    <!-- شريط بحث سريع وخيار منطقتي فقط عند الحاجة -->
    <div class="max-w-xl mx-auto px-4 pb-2.5 flex items-center gap-2">
      <input
        id="searchInput"
        type="text"
        oninput="renderAll()"
        placeholder="ابحث عن سلعة أو منطقة..."
        class="w-full text-xs bg-white border border-emerald-900/15 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-600"
      />
      <button
        id="myZoneBtn"
        onclick="toggleMyZoneOnly()"
        class="text-xs font-bold bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-3 py-2 rounded-xl transition shrink-0"
      >
        منطقتي
      </button>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-4 mt-4 space-y-3.5">

    <!-- شريط ذكي مختصر يبرز الأرخص والأكثر نشاطاً دون إطالة -->
    <div id="smartStrip" class="flex items-center gap-2 overflow-x-auto pb-1 text-xs"></div>

    <!-- قائمة الأسعار المباشرة -->
    <section id="cardsContainer" class="space-y-3">
      <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center text-xs text-slate-500">
        جاري تحميل الأسعار...
      </div>
    </section>

  </main>

  <!-- نافذة نشر سلعة / سعر جديد -->
  <div id="addModal" class="fixed inset-0 z-50 bg-slate-950/50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl space-y-3.5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
        <h2 class="font-extrabold text-base text-slate-900">نشر سعر جديد</h2>
        <button onclick="closeAddModal()" class="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
      </div>

      <form onsubmit="submitNewItem(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">السلعة</label>
          <input
            id="addName"
            type="text"
            required
            placeholder="مثال: سكر، دقيق، زيت..."
            class="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-700"
          />
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">السعر</label>
            <input
              id="addPrice"
              type="number"
              step="any"
              required
              placeholder="0"
              class="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-700"
            />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">الوحدة</label>
            <input
              id="addUnit"
              type="text"
              value="كيس / وحدة"
              class="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-700"
            />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">المنطقة أو الحي</label>
          <input
            id="addArea"
            type="text"
            required
            placeholder="اكتب اسم المنطقة أو الحي"
            class="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-700"
          />
        </div>

        <div class="flex gap-2 pt-1">
          <button
            type="submit"
            class="flex-1 bg-[#1b7a43] hover:bg-[#156235] text-white font-bold text-sm py-2.5 rounded-xl transition"
          >
            نشر الآن
          </button>
          <button
            type="button"
            onclick="closeAddModal()"
            class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm py-2.5 rounded-xl transition"
          >
            إلغاء
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة تحديث سعر موجود -->
  <div id="updateModal" class="fixed inset-0 z-50 bg-slate-950/50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl space-y-3.5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
        <h2 id="updateTitle" class="font-extrabold text-base text-slate-900">تحديث السعر</h2>
        <button onclick="closeUpdateModal()" class="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
      </div>

      <form onsubmit="submitPriceUpdate(event)" class="space-y-3">
        <input type="hidden" id="updateItemId" />
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">السعر الجديد</label>
          <input
            id="updatePrice"
            type="number"
            step="any"
            required
            class="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-700"
          />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">المنطقة أو الحي</label>
          <input
            id="updateArea"
            type="text"
            required
            placeholder="اكتب اسم المنطقة أو الحي"
            class="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-700"
          />
        </div>
        <div class="flex gap-2 pt-1">
          <button
            type="submit"
            class="flex-1 bg-[#1b7a43] hover:bg-[#156235] text-white font-bold text-sm py-2.5 rounded-xl transition"
          >
            حفظ وبث التحديث
          </button>
          <button
            type="button"
            onclick="closeUpdateModal()"
            class="px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold text-sm py-2.5 rounded-xl transition"
          >
            إلغاء
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- نافذة حسابي (الاسم والمنطقة اختيارياً + تصدير/استيراد) -->
  <div id="profileModal" class="fixed inset-0 z-50 bg-slate-950/50 hidden items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-2xl p-5 shadow-xl space-y-3.5">
      <div class="flex items-center justify-between border-b border-slate-100 pb-2.5">
        <h2 class="font-extrabold text-base text-slate-900">إعداداتي السريعة</h2>
        <button onclick="closeProfileModal()" class="text-slate-400 hover:text-slate-700 text-lg font-bold">✕</button>
      </div>

      <div class="space-y-2.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">اسمك الظاهر (اختياري)</label>
          <input
            id="profileName"
            type="text"
            placeholder="مثال: محمد"
            class="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-700"
          />
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">منطقتي المفضلة (اختياري)</label>
          <input
            id="profileZone"
            type="text"
            placeholder="اكتب منطقتك"
            class="w-full text-sm border border-slate-300 rounded-xl px-3.5 py-2 focus:outline-none focus:border-emerald-700"
          />
        </div>
        <div class="text-[11px] text-slate-500 bg-slate-50 px-3 py-2 rounded-xl flex items-center justify-between">
          <span>معرّفك الفريد:</span>
          <span id="profileUserId" class="font-bold text-slate-800"></span>
        </div>
        <button
          onclick="saveProfile()"
          class="w-full bg-[#1b7a43] hover:bg-[#156235] text-white font-bold text-sm py-2.5 rounded-xl transition"
        >
          حفظ الإعدادات
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-100">
        <button
          onclick="exportData()"
          class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold py-2 rounded-xl transition"
        >
          تصدير نسخة JSON
        </button>
        <label class="bg-slate-100 hover:bg-slate-200 text-slate-800 text-xs font-bold py-2 rounded-xl text-center transition cursor-pointer">
          استيراد JSON
          <input type="file" accept=".json,application/json" onchange="importData(event)" class="hidden" />
        </label>
      </div>
    </div>
  </div>

  <!-- تنبيه عائم -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/gun/gun.js"></script>
  <script>
    const RENDER_RELAY_URL = "https://sudan-market-2.onrender.com/gun";[span_5](start_span)[span_5](end_span)

    const ITEMS_KEY = "radar_simple_items_v3";
    const DELETED_KEY = "radar_simple_deleted_v3";
    const UID_KEY = "radar_simple_uid_v3";
    const NAME_KEY = "radar_simple_name_v3";
    const ZONE_KEY = "radar_simple_zone_v3";
    const ONLY_ZONE_KEY = "radar_simple_only_zone_v3";

    function norm(str = "") {
      return String(str)
        .toLowerCase()
        .replace(/[\u064B-\u065F\u0670]/g, "")
        .replace(/[إأآا]/g, "ا")
        .replace(/ى/g, "ي")
        .replace(/ة/g, "ه")
        .replace(/\s+/g, " ")
        .trim();
    }

    function getUserId() {
      let id = localStorage.getItem(UID_KEY);
      if (!id) {
        id = "u_" + Math.random().toString(36).substring(2, 8);
        localStorage.setItem(UID_KEY, id);
      }
      return id;
    }

    const myUserId = getUserId();
    let onlyMyZone = localStorage.getItem(ONLY_ZONE_KEY) === "true";
    let itemsMap = loadJson(ITEMS_KEY, {});
    let deletedMap = loadJson(DELETED_KEY, {});

    function loadJson(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveState() {
      localStorage.setItem(ITEMS_KEY, JSON.stringify(itemsMap));
      localStorage.setItem(DELETED_KEY, JSON.stringify(deletedMap));
    }

    function showToast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(window._t);
      window._t = setTimeout(() => el.classList.add("hidden"), 2400);
    }

    function getPublisherName() {
      return (localStorage.getItem(NAME_KEY) || "").trim() || "مستخدم";
    }

    function getSavedZone() {
      return (localStorage.getItem(ZONE_KEY) || "").trim();
    }

    function updateMyZoneBtn() {
      const btn = document.getElementById("myZoneBtn");
      if (onlyMyZone) {
        btn.textContent = "منطقتي ✓";
        btn.className = "text-xs font-extrabold bg-[#1b7a43] text-white px-3 py-2 rounded-xl transition shrink-0";
      } else {
        btn.textContent = "منطقتي";
        btn.className = "text-xs font-bold bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 px-3 py-2 rounded-xl transition shrink-0";
      }
    }

    function toggleMyZoneOnly() {
      const z = getSavedZone();
      if (!onlyMyZone && !z) {
        openProfileModal();
        showToast("اكتب منطقتك أولاً في إعداداتي السريعة");
        return;
      }
      onlyMyZone = !onlyMyZone;
      localStorage.setItem(ONLY_ZONE_KEY, String(onlyMyZone));
      updateMyZoneBtn();
      renderAll();
    }

    updateMyZoneBtn();

    function normalizeVoters(votersObj, confCount, pubId) {
      const map = {};
      if (votersObj && typeof votersObj === "object") {
        Object.keys(votersObj).forEach((k) => {
          if (votersObj[k]) map[String(k)] = true;
        });
      }
      if (Object.keys(map).length === 0 && Number(confCount || 0) > 0 && pubId) {
        map[String(pubId)] = true;
      }
      return map;
    }

    function mergeEntry(entry) {
      if (!entry || !entry.id) return false;
      const id = String(entry.id);
      const incTs = Number(entry.updatedAt || 0);
      const delTs = Math.max(Number(entry.deletedAt || 0), Number(deletedMap[id]?.deletedAt || 0));

      if (entry.deleted) {
        if (delTs > Number(deletedMap[id]?.deletedAt || 0) || itemsMap[id]) {
          deletedMap[id] = { deleted: true, deletedAt: delTs || Date.now() };
          if (itemsMap[id] && Number(itemsMap[id].updatedAt || 0) <= deletedMap[id].deletedAt) {
            delete itemsMap[id];
          }
          return true;
        }
        return false;
      }

      if (delTs > 0 && incTs <= delTs) {
        if (itemsMap[id]) {
          delete itemsMap[id];
          return true;
        }
        return false;
      }

      if (!entry.name) return false;

      const existing = itemsMap[id];
      const extTs = Number(existing?.updatedAt || 0);
      const mergedVoters = {
        ...normalizeVoters(existing?.voters, existing?.confirmations, existing?.publisherId),
        ...normalizeVoters(entry.voters, entry.confirmations, entry.publisherId)
      };
      const conf = Math.max(
        Object.keys(mergedVoters).length,
        (!existing || incTs >= extTs) ? Number(entry.confirmations || 0) : Number(existing?.confirmations || 0)
      );

      if (!existing || incTs >= extTs) {
        itemsMap[id] = {
          id,
          name: String(entry.name).trim(),
          unit: String(entry.unit || "وحدة").trim(),
          currency: String(entry.currency || "ج.س").trim(),
          price: Number(entry.price || 0),
          area: String(entry.area || "غير محدد").trim(),
          voters: mergedVoters,
          confirmations: conf,
          disputes: Math.max(Number(entry.disputes || 0), Number(existing?.disputes || 0)),
          publisherName: String(entry.publisherName || existing?.publisherName || "مستخدم").trim(),
          publisherId: String(entry.publisherId || existing?.publisherId || myUserId).trim(),
          updatedAt: incTs || Date.now(),
          deleted: false
        };
        return true;
      } else if (Object.keys(mergedVoters).length > Object.keys(existing.voters || {}).length) {
        existing.voters = mergedVoters;
        existing.confirmations = Object.keys(mergedVoters).length;
        return true;
      }
      return false;
    }

    // تهيئة Gun.js مع إظهار حالة الاتصال بوضوح
    const gun = Gun({ peers: [RENDER_RELAY_URL], retry: 2000 });
    const itemsNode = gun.get("sudan_radar_v3").get("items");
    const presenceNode = gun.get("sudan_radar_v3").get("presence");

    const dotEl = document.getElementById("relayDot");
    const statusEl = document.getElementById("relayStatus");

    function setConnectedState(isConnected) {
      if (isConnected) {
        dotEl.className = "w-2 h-2 rounded-full bg-[#1b7a43] inline-block shrink-0";
        statusEl.textContent = "متصل بـ Render";
      } else {
        dotEl.className = "w-2 h-2 rounded-full bg-amber-500 inline-block shrink-0";
        statusEl.textContent = "غير متصل بـ Render (حفظ محلي)";
      }
    }

    setConnectedState(false);

    gun.on("hi", () => {
      setConnectedState(true);
      sendHeartbeat();
      Object.values(itemsMap).forEach((it) => {
        if (!it.deleted) itemsNode.get(it.id).put(it);
      });
    });

    gun.on("bye", () => {
      setConnectedState(false);
    });

    // فحص مباشر لاستجابة خدمة Render لإظهار متصل / غير متصل بدقة
    function checkRenderHealth() {
      const baseUrl = RENDER_RELAY_URL.replace(/\/gun\/?$/, "");
      fetch(baseUrl, { cache: "no-store" })
        .then((res) => {
          if (res.ok) setConnectedState(true);
        })
        .catch(() => {});
    }

    checkRenderHealth();
    setInterval(checkRenderHealth, 15000);

    // حضور المتصلين الآن (نافذة 25 ثانية)
    const peersAlive = { [myUserId]: Date.now() };
    const ALIVE_MS = 25000;

    function sendHeartbeat() {
      const now = Date.now();
      peersAlive[myUserId] = now;
      presenceNode.get(myUserId).put({ userId: myUserId, lastSeen: now, online: true });
      renderOnlineBadge();
    }

    function renderOnlineBadge() {
      const now = Date.now();
      peersAlive[myUserId] = now;
      let n = 0;
      Object.keys(peersAlive).forEach((uid) => {
        if (now - Number(peersAlive[uid] || 0) <= ALIVE_MS) n++;
        else delete peersAlive[uid];
      });
      document.getElementById("onlineCountBadge").textContent = `متصل: ${Math.max(1, n)}`;
    }

    presenceNode.map().on((data, key) => {
      const uid = String(data?.userId || key || "").trim();
      if (!uid) return;
      if (data && data.online === false) {
        delete peersAlive[uid];
        renderOnlineBadge();
        return;
      }
      const ts = Number(data?.lastSeen || 0);
      if (ts > 0 && Date.now() - ts <= ALIVE_MS) {
        peersAlive[uid] = ts;
        renderOnlineBadge();
      }
    });

    sendHeartbeat();
    setInterval(sendHeartbeat, 10000);
    setInterval(renderOnlineBadge, 5000);

    window.addEventListener("beforeunload", () => {
      presenceNode.get(myUserId).put({ userId: myUserId, lastSeen: Date.now(), online: false });
    });

    itemsNode.map().on((data, key) => {
      if (!data || !key) return;
      const changed = mergeEntry({ ...data, id: data.id || key });
      if (changed) {
        saveState();
        renderAll();
      }
    });

    function computeTrust(item, allList) {
      const votersCount = Object.keys(item.voters || {}).length;
      const conf = Math.max(votersCount, Number(item.confirmations || 0));
      const disp = Math.max(0, Number(item.disputes || 0));
      const consensus = (conf + disp) > 0 ? conf / (conf + disp) : 0.5;
      const ageHours = Math.max(0, (Date.now() - Number(item.updatedAt || Date.now())) / 3600000);
      const freshness = Math.exp(-ageHours / 72);
      const crowd = 1 - Math.exp(-conf / 4);

      const gKey = norm(item.name);
      const zKey = norm(item.area);
      const peers = allList
        .filter((x) => norm(x.name) === gKey && norm(x.area) === zKey && Number(x.price) > 0)
        .map((x) => Number(x.price));

      let consistency = 1;
      if (peers.length >= 2 && Number(item.price) > 0) {
        const avg = peers.reduce((a, b) => a + b, 0) / peers.length;
        consistency = Math.max(0.55, 1 - Math.min(0.45, Math.abs(Number(item.price) - avg) / avg));
      }

      const pct = Math.min(99, Math.max(15, Math.round((consensus * 0.45 + crowd * 0.25 + freshness * 0.15 + consistency * 0.15) * 100)));
      return { pct, conf };
    }

    function confirmItem(id) {
      const item = itemsMap[id];
      if (!item) return;
      const voters = normalizeVoters(item.voters, item.confirmations, item.publisherId);
      if (voters[myUserId]) {
        showToast("أكّدت هذا السعر مسبقاً");
        return;
      }
      voters[myUserId] = true;
      const updated = {
        ...item,
        voters,
        confirmations: Object.keys(voters).length,
        updatedAt: Date.now()
      };
      itemsMap[id] = updated;
      saveState();
      itemsNode.get(id).put(updated);
      renderAll();
      showToast("تم تأكيد السعر ✓");
    }

    function deleteItem(id) {
      const item = itemsMap[id];
      if (!item || String(item.publisherId) !== String(myUserId)) return;
      const now = Date.now();
      deletedMap[id] = { deleted: true, deletedAt: now };
      delete itemsMap[id];
      saveState();
      itemsNode.get(id).put({ id, deleted: true, deletedAt: now, deletedBy: myUserId });
      renderAll();
      showToast("تم حذف منشورك ✓");
    }

    function openAddModal() {
      const z = getSavedZone();
      if (z && !document.getElementById("addArea").value) {
        document.getElementById("addArea").value = z;
      }
      const m = document.getElementById("addModal");
      m.classList.remove("hidden");
      m.classList.add("flex");
      document.getElementById("addName").focus();
    }

    function closeAddModal() {
      const m = document.getElementById("addModal");
      m.classList.add("hidden");
      m.classList.remove("flex");
    }

    function submitNewItem(e) {
      e.preventDefault();
      const name = document.getElementById("addName").value.trim();
      const price = Number(document.getElementById("addPrice").value);
      const unit = document.getElementById("addUnit").value.trim() || "وحدة";
      const area = document.getElementById("addArea").value.trim();
      if (!name || !price || price <= 0 || !area) return;

      const now = Date.now();
      const id = "item_" + now + "_" + Math.random().toString(36).substring(2, 6);
      const newItem = {
        id,
        name,
        price,
        unit,
        currency: "ج.س",
        area,
        voters: { [myUserId]: true },
        confirmations: 1,
        disputes: 0,
        publisherName: getPublisherName(),
        publisherId: myUserId,
        updatedAt: now,
        deleted: false
      };

      delete deletedMap[id];
      itemsMap[id] = newItem;
      saveState();

      // حفظ فوري وعرض مباشر ثم بث للشبكة
      e.target.reset();
      document.getElementById("addUnit").value = "كيس / وحدة";
      closeAddModal();
      renderAll();
      showToast("تم النشر بنجاح ✓");

      try {
        itemsNode.get(id).put(newItem);
      } catch {}
    }

    function openUpdateModal(id) {
      const item = itemsMap[id];
      if (!item) return;
      document.getElementById("updateItemId").value = item.id;
      document.getElementById("updateTitle").textContent = `تحديث: ${item.name}`;
      document.getElementById("updatePrice").value = item.price;
      document.getElementById("updateArea").value = getSavedZone() || item.area || "";
      const m = document.getElementById("updateModal");
      m.classList.remove("hidden");
      m.classList.add("flex");
      document.getElementById("updatePrice").focus();
    }

    function closeUpdateModal() {
      const m = document.getElementById("updateModal");
      m.classList.add("hidden");
      m.classList.remove("flex");
    }

    function submitPriceUpdate(e) {
      e.preventDefault();
      const id = document.getElementById("updateItemId").value;
      const price = Number(document.getElementById("updatePrice").value);
      const area = document.getElementById("updateArea").value.trim();
      const item = itemsMap[id];
      if (!item || !price || price <= 0 || !area) return;

      const updated = {
        ...item,
        price,
        area,
        voters: { [myUserId]: true },
        confirmations: 1,
        disputes: Number(item.disputes || 0) + 1,
        publisherName: getPublisherName(),
        publisherId: myUserId,
        updatedAt: Date.now()
      };

      itemsMap[id] = updated;
      saveState();
      closeUpdateModal();
      renderAll();
      showToast("تم تحديث السعر ✓");

      try {
        itemsNode.get(id).put(updated);
      } catch {}
    }

    function openProfileModal() {
      document.getElementById("profileName").value = localStorage.getItem(NAME_KEY) || "";
      document.getElementById("profileZone").value = getSavedZone();
      document.getElementById("profileUserId").textContent = myUserId;
      const m = document.getElementById("profileModal");
      m.classList.remove("hidden");
      m.classList.add("flex");
    }

    function closeProfileModal() {
      const m = document.getElementById("profileModal");
      m.classList.add("hidden");
      m.classList.remove("flex");
    }

    function saveProfile() {
      const n = document.getElementById("profileName").value.trim();
      const z = document.getElementById("profileZone").value.trim();
      if (n) localStorage.setItem(NAME_KEY, n);
      else localStorage.removeItem(NAME_KEY);

      if (z) localStorage.setItem(ZONE_KEY, z);
      else {
        localStorage.removeItem(ZONE_KEY);
        onlyMyZone = false;
        localStorage.setItem(ONLY_ZONE_KEY, "false");
        updateMyZoneBtn();
      }
      closeProfileModal();
      renderAll();
      showToast("تم حفظ إعداداتك ✓");
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(Object.values(itemsMap), null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `radar-prices-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importData(e) {
      const file = e.target.files?.[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const parsed = JSON.parse(String(reader.result || "[]"));
          const list = Array.isArray(parsed) ? parsed : (parsed.items || []);
          let count = 0;
          list.forEach((entry) => {
            if (mergeEntry(entry)) {
              count++;
              itemsNode.get(entry.id).put(itemsMap[entry.id]);
            }
          });
          saveState();
          renderAll();
          showToast(`تم استيراد ${count} بند ✓`);
        } catch {
          showToast("ملف غير صالح");
        }
        e.target.value = "";
      };
      reader.readAsText(file);
    }

    function timeAgo(ts) {
      const sec = Math.max(1, Math.floor((Date.now() - Number(ts || Date.now())) / 1000));
      if (sec < 60) return `منذ ${sec} ث`;
      const min = Math.floor(sec / 60);
      if (min < 60) return `منذ ${min} د`;
      const hr = Math.floor(min / 60);
      if (hr < 24) return `منذ ${hr} س`;
      return `منذ ${Math.floor(hr / 24)} ي`;
    }

    function esc(s = "") {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function escJs(s = "") {
      return String(s).replace(/\\/g, "\\\\").replace(/'/g, "\\'");
    }

    function renderSmartStrip(allList) {
      const strip = document.getElementById("smartStrip");
      const lowestByGood = {};
      const zoneCounts = {};

      allList.forEach((it) => {
        const gKey = norm(it.name);
        const zKey = norm(it.area);
        const p = Number(it.price || 0);
        if (zKey) {
          zoneCounts[zKey] = zoneCounts[zKey] || { label: it.area, count: 0 };
          zoneCounts[zKey].count++;
        }
        if (gKey && p > 0 && (!lowestByGood[gKey] || p < lowestByGood[gKey].price)) {
          lowestByGood[gKey] = { ...it, price: p };
        }
      });

      const cheapest = Object.values(lowestByGood).sort((a, b) => a.price - b.price).slice(0, 3);
      const topZone = Object.values(zoneCounts).sort((a, b) => b.count - a.count)[0];

      const chips = [];
      cheapest.forEach((c) => {
        chips.push(`
          <button onclick="quickSearch('${escJs(c.name)}')" class="bg-white border border-emerald-200 text-slate-800 px-3 py-1.5 rounded-full shrink-0 font-bold flex items-center gap-1.5">
            <span class="text-[#1b7a43]">أقل ${esc(c.name)}:</span>
            <span>${Number(c.price).toLocaleString()}</span>
            <span class="text-[10px] text-slate-500">(${esc(c.area)})</span>
          </button>
        `);
      });

      if (topZone) {
        chips.push(`
          <button onclick="quickSearch('${escJs(topZone.label)}')" class="bg-white border border-slate-200 text-slate-700 px-3 py-1.5 rounded-full shrink-0 font-bold">
            الأكثر نشاطاً: ${esc(topZone.label)} (${topZone.count})
          </button>
        `);
      }

      strip.innerHTML = chips.join("");
    }

    function quickSearch(val) {
      document.getElementById("searchInput").value = val;
      renderAll();
    }

    function renderAll() {
      const allList = Object.values(itemsMap).filter((it) => !it.deleted && !deletedMap[it.id]?.deleted);
      renderSmartStrip(allList);

      const q = norm(document.getElementById("searchInput").value);
      const savedZone = norm(getSavedZone());

      const lowestPriceByGood = {};
      allList.forEach((it) => {
        const gKey = norm(it.name);
        const p = Number(it.price || 0);
        if (gKey && p > 0 && (!lowestPriceByGood[gKey] || p < lowestPriceByGood[gKey])) {
          lowestPriceByGood[gKey] = p;
        }
      });

      const list = allList
        .filter((it) => {
          if (onlyMyZone && savedZone && norm(it.area) !== savedZone) return false;
          if (!q) return true;
          return norm(`${it.name} ${it.area} ${it.publisherName}`).includes(q);
        })
        .sort((a, b) => {
          if (!onlyMyZone && savedZone) {
            const aZ = norm(a.area) === savedZone ? 1 : 0;
            const bZ = norm(b.area) === savedZone ? 1 : 0;
            if (aZ !== bZ) return bZ - aZ;
          }
          return Number(b.updatedAt || 0) - Number(a.updatedAt || 0);
        });

      const container = document.getElementById("cardsContainer");
      if (list.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl border border-slate-200 p-8 text-center space-y-2">
            <p class="text-sm font-extrabold text-slate-800">لا توجد أسعار معروضة بعد</p>
            <p class="text-xs text-slate-500">اضغط "+ نشر سعر" لإضافة أول سعر في منطقتك.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = list.map((item) => {
        const gKey = norm(item.name);
        const price = Number(item.price || 0);
        const isLowest = price > 0 && lowestPriceByGood[gKey] === price;
        const { pct, conf } = computeTrust(item, allList);
        const confirmedByMe = Boolean(normalizeVoters(item.voters, item.confirmations, item.publisherId)[myUserId]);
        const isMine = String(item.publisherId) === String(myUserId);

        const badge = isLowest
          ? `<div class="bg-[#1b7a43] text-white rounded-xl px-3 py-1.5 text-right shrink-0">
               <div class="text-[10px] font-extrabold">أقل سعر الآن</div>
               <div class="text-xs font-bold">${esc(item.area)}</div>
               <div class="text-[10px] text-emerald-100">${timeAgo(item.updatedAt)}</div>
             </div>`
          : `<div class="bg-amber-500 text-slate-950 rounded-xl px-3 py-1.5 text-right shrink-0">
               <div class="text-[10px] font-extrabold">سعر مسجّل</div>
               <div class="text-xs font-bold">${esc(item.area)}</div>
               <div class="text-[10px] text-slate-900/80">${timeAgo(item.updatedAt)}</div>
             </div>`;

        return `
          <article class="bg-white rounded-2xl border border-slate-200 p-4 space-y-3 shadow-2xs">
            <div class="flex items-start justify-between gap-2.5">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-10 h-10 rounded-xl bg-amber-50 border border-amber-200/70 flex items-center justify-center text-lg shrink-0">
                  🛒
                </div>
                <div class="min-w-0">
                  <h2 class="text-base font-extrabold text-slate-900 truncate">${esc(item.name)}</h2>
                  <p class="text-[11px] text-slate-500 truncate">${esc(item.unit)} • ${esc(item.publisherName)}</p>
                </div>
              </div>
              ${badge}
            </div>

            <div class="flex items-baseline justify-between bg-slate-50 rounded-xl px-3.5 py-2 border border-slate-100">
              <span class="text-xs font-bold text-slate-500">السعر</span>
              <div class="text-2xl font-extrabold text-slate-900">
                ${price.toLocaleString()}
                <span class="text-xs font-bold text-slate-600">${esc(item.currency)}</span>
              </div>
            </div>

            <div class="space-y-1">
              <div class="flex items-center justify-between text-[11px] font-bold text-slate-700">
                <span>ثقة المجتمع: ${pct}% • <span class="text-[#1b7a43]">${esc(item.area)}</span></span>
                <span class="text-slate-500">${conf} تأكيد</span>
              </div>
              <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden">
                <div class="h-full bg-[#1b7a43]" style="width: ${pct}%"></div>
              </div>
            </div>

            <div class="grid ${isMine ? "grid-cols-3" : "grid-cols-2"} gap-2">
              <button
                onclick="confirmItem('${item.id}')"
                class="${confirmedByMe ? "bg-[#1b7a43] hover:bg-[#156235]" : "bg-[#235d9f] hover:bg-[#1b4b82]"} text-white text-xs font-extrabold py-2.5 rounded-xl transition"
              >
                ${confirmedByMe ? "مؤكّد ✓" : "تأكيد"}
              </button>
              <button
                onclick="openUpdateModal('${item.id}')"
                class="bg-slate-200/80 hover:bg-slate-300 text-slate-800 text-xs font-extrabold py-2.5 rounded-xl transition"
              >
                تحديث
              </button>
              ${isMine ? `
                <button
                  onclick="deleteItem('${item.id}')"
                  class="bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 text-xs font-extrabold py-2.5 rounded-xl transition"
                >
                  حذف
                </button>
              ` : ""}
            </div>
          </article>
        `;
      }).join("");
    }

    renderAll();
  </script>
</body>
</html>
