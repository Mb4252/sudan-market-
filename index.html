<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-chat-ui.css">
    <style>
        .user-settings {
            margin: 10px 0;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 5px;
        }
        .user-settings label {
            margin-right: 10px;
        }
        body.light {
            background-color: #ffffff;
            color: #000000;
        }
        body.dark {
            background-color: #121212;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان - واجهة SDM</h1>
        </div>
        <div id="sdm-chat" class="chat-container"></div>
        <input type="text" id="sdm-name" placeholder="أدخل هويةك للدردشة" class="input-field">
        <input type="text" id="sdm-message" placeholder="اكتب رسالتك" class="input-field">
        <button id="sdm-send-btn" class="send-button">إرسال</button>
        <div id="connection-status" class="connection-status">غير متصل</div>
        <div id="user-settings" class="user-settings">
            <label for="theme-selector">الوضع:</label>
            <select id="theme-selector">
                <option value="light">فاتح</option>
                <option value="dark">داكن</option>
            </select>
            <label for="notifications-toggle">التنبيهات:</label>
            <input type="checkbox" id="notifications-toggle">
        </div>
    </div>

    <!-- تضمين ملفات JS مع try/catch و defer -->
    <script defer>
        try {
            // تضمين ملفات JS الموجودة مسبقاً
            const scripts = [
                'public/core/dom-date-guard.js',
                'public/core/local-posts-store.js',
                'public/core/render-stream.js'
            ];

            scripts.forEach(script => {
                const scriptElement = document.createElement('script');
                scriptElement.src = script;
                scriptElement.defer = true;
                document.body.appendChild(scriptElement);
            });

            // تضمين ملف SDM الجديد
            const sdmScript = document.createElement('script');
            sdmScript.src = 'public/sdm/sdm-module-123.js';
            sdmScript.defer = true;
            document.body.appendChild(sdmScript);

            // إضافة ميزة حفظ الإعدادات عند تغييرها
            document.getElementById('theme-selector').addEventListener('change', function() {
                try {
                    const settings = sdmModule123.loadUserSettings();
                    settings.theme = this.value;
                    sdmModule123.saveUserSettings(settings);
                    sdmModule123.applySettings(settings);
                } catch (error) {
                    console.error('Error saving theme:', error);
                }
            });

            document.getElementById('notifications-toggle').addEventListener('change', function() {
                try {
                    const settings = sdmModule123.loadUserSettings();
                    settings.notifications = this.checked;
                    sdmModule123.saveUserSettings(settings);
                } catch (error) {
                    console.error('Error saving notifications:', error);
                }
            });
        } catch (error) {
            console.error('Failed to load scripts:', error);
        }
    </script>
</body>
</html>
