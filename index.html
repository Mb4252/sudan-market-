<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-addon-24.css">
    <script src="public/core/dom-date-guard.js"></script>
    <script src="public/core/local-posts-store.js"></script>
    <script src="public/core/render-stream.js"></script>
    <script src="public/sdm/sdm-storage.js"></script>
    <script src="public/sdm/sdm-engine.js"></script>
    <script src="public/sdm/sdm-chat-ui.js"></script>
    <script src="public/sdm/sdm-render-sync.js"></script>
    <script src="public/sdm/sdm-shell.js"></script>
    <script src="public/sdm/sdm-commands.js"></script>
    <script src="public/sdm/sdm-addon-24.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .identity-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .chat-container {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background-color: white;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .message-input {
            width: 70%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .send-button {
            width: 25%;
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .send-button:hover {
            background-color: #45a049;
        }
        #connection-status {
            text-align: center;
            margin-bottom: 10px;
            font-size: 14px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان - واجهة SDM</h1>
            <div id="connection-status">متصل بالخدمة</div>
        </div>
        <input type="text" class="identity-input" placeholder="ادخل اسمك أو معرفك">
        <div class="chat-container" id="chat-container">
            <!-- الرسائل ستظهر هنا -->
        </div>
        <div>
            <input type="text" class="message-input" placeholder="اكتب رسالتك هنا" id="message-input">
            <button class="send-button" id="send-button">إرسال</button>
        </div>
    </div>
    <script>
        // تأكد من عدم ظهور الشاشة البيضاء
        document.addEventListener('DOMContentLoaded', function() {
            try {
                // التحقق من وجود العناصر الأساسية
                if (!document.getElementById('chat-container') || !document.getElementById('message-input') || !document.getElementById('send-button')) {
                    console.error('Some essential elements are missing.');
                }
            } catch (e) {
                console.error('Error in DOMContentLoaded:', e);
            }
        });
    </script>
</body>
</html>
