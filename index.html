<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="logo">
                <div class="logo-icon">🏛️</div>
                سوق السودان
            </div>
            <nav class="nav">
                <div class="nav-links">
                    <a href="#" class="nav-link">الرئيسية</a>
                    <a href="#" class="nav-link">المنشورات</a>
                    <a href="#" class="nav-link">الرادار</a>
                    <a href="#" class="nav-link">المقارنة</a>
                </div>
                <div class="mobile-menu">☰</div>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <section class="post-section">
                <h2 class="section-title">نشر منشور جديد</h2>
                <div class="card">
                    <form id="postForm">
                        <div class="form-group">
                            <label for="city">المدينة:</label>
                            <select id="city" required>
                                <option value="">اختر المدينة</option>
                                <option value="الخرطوم">الخرطوم</option>
                                <option value="أم درمان">أم درمان</option>
                                <option value="بحري">بحري</option>
                                <option value="كردفان">كردفان</option>
                                <option value="الجزيرة">الجزيرة</option>
                                <option value="القضارف">القضارف</option>
                                <option value="سنار">سنار</option>
                                <option value="النيل الأبيض">النيل الأبيض</option>
                                <option value="النيل الأزرق">النيل الأزرق</option>
                                <option value="البحر الأحمر">البحر الأحمر</option>
                                <option value="كاسالا">كاسالا</option>
                                <option value="النيل">النيل</option>
                                <option value="شمال كردفان">شمال كردفان</option>
                                <option value="جنوب كردفان">جنوب كردفان</option>
                                <option value="شمال دارفور">شمال دارفور</option>
                                <option value="جنوب دارفور">جنوب دارفور</option>
                                <option value="غرب دارفور">غرب دارفور</option>
                                <option value="وسط دارفور">وسط دارفور</option>
                                <option value="شرق دارفور">شرق دارفور</option>
                                <option value="شمال البahr">شمال البahr</option>
                                <option value="جنوب البahr">جنوب البahr</option>
                                <option value="غرب البahr">غرب البahr</option>
                                <option value="وسط البahr">وسط البahr</option>
                                <option value="شرق البahr">شرق البahr</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="product">المنتج:</label>
                            <input type="text" id="product" required>
                        </div>
                        <div class="form-group">
                            <label for="price">السعر:</label>
                            <input type="number" id="price" required>
                        </div>
                        <div class="form-group">
                            <label for="volume">الكمية:</label>
                            <input type="number" id="volume" required>
                        </div>
                        <div class="form-group">
                            <label for="author">اسمك:</label>
                            <input type="text" id="author" required>
                        </div>
                        <button type="submit" class="btn">نشر</button>
                    </form>
                </div>
            </section>

            <section class="stats-section">
                <h2 class="section-title">الإحصائيات</h2>
                <div class="card">
                    <div class="stats-grid">
                        <div class="stat-item">
                            <h3>إجمالي المنشورات</h3>
                            <p id="totalPosts">0</p>
                        </div>
                        <div class="stat-item">
                            <h3>المتوسط السعر</h3>
                            <p id="avgPrice">0</p>
                        </div>
                        <div class="stat-item">
                            <h3>المدن النشطة</h3>
                            <p id="activeCities">0</p>
                        </div>
                    </div>
                </div>
            </section>

            <section class="posts-section">
                <h2 class="section-title">المنشورات الأخيرة</h2>
                <div class="card">
                    <div id="posts" class="posts-list"></div>
                </div>
            </section>

            <section class="radar-section">
                <h2 class="section-title">رادار الأسعار</h2>
                <div class="card">
                    <div id="radarContent" class="radar-content"></div>
                </div>
            </section>

            <section class="compare-section">
                <h2 class="section-title">مقارنة الأسعار</h2>
                <div class="card">
                    <button id="compareBtn" class="btn">مقارنة</button>
                    <div id="compareOverlay" class="compare-overlay">
                        <div id="compareContent" class="compare-content"></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>سوق السودان © 2023</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
