<!DOCTYPE html>\n<html lang=\"ar\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<title>سوق السودان - تحليل الأسعار</title>\n<link rel=\"stylesheet\" href=\"styles.css\">\n<script src=\"https://cdn.jsdelivr.net/npm/chart.js\"></script>\n</head>\n<body>\n<div class=\"app\">\n<header class=\"header\"><h1>سوق السودان</h1></header>\n<div class=\"status-bar\">\n<span id=\"status\" class=\"badge badge-loading\">جارِ التحميل...</span>\n<span id=\"syncBadge\" class=\"badge\">مزامنة...</span>\n</div>\n<section id=\"postSection\" class=\"card\">\n<h2>نشر جديد</h2>\n<input id=\"author\" type=\"text\" placeholder=\"اسمك\" class=\"input\">\n<textarea id=\"content\" placeholder=\"ما تريد نشره...\" class=\"textarea\"></textarea>\n<button id=\"publishBtn\" class=\"btn primary\">نشر الآن</button>\n</section>\n<section id=\"posts\" class=\"card\">\n<h2>المنشورات</h2>\n<div id=\"postsList\"></div>\n</section>\n<section id=\"compareOverlay\" class=\"overlay hidden\">\n<div id=\"compareContent\" class=\"card\">\n<h2>مقارنة</h2>\n<button id=\"compareBtn\" class=\"btn secondary\">عرض المقارنة</button>\n</div>\n</section>\n<section id=\"radarSection\" class=\"card\">\n<h2>رادار الأسعار</h2>\n<canvas id=\"priceRadar\" width=\"400\" height=\"200\"></canvas>\n</section>\n<section id=\"chartsSection\" class=\"card\">\n<h2>تحليلات</h2>\n<canvas id=\"chartVolume\" width=\"400\" height=\"200\"></canvas>\n<canvas id=\"chartPrice\" width=\"400\" height=\"200\"></canvas>\n</section>\n</div>\n<script src=\"app.js\"></script>\n</body>\n</html>
