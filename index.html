<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
</head>
<body>
    <div class="sidebar">
        <h2>سوق السودان</h2>
        <ul class="sidebar-nav">
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#">المنتجات</a></li>
            <li><a href="#">المنشورات</a></li>
            <li><a href="#">الرادار</a></li>
            <li><a href="#">المقارنة</a></li>
        </ul>
    </div>
    <div class="main-content">
        <div class="header">
            <h1>سوق السودان</h1>
            <input type="text" class="search-box" placeholder="بحث...">
        </div>
        <div class="card">
            <h2>نشر منتج جديد</h2>
            <form id="publishForm">
                <div class="form-group">
                    <label for="productName">اسم المنتج</label>
                    <input type="text" id="productName" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="productPrice">السعر</label>
                    <input type="number" id="productPrice" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="productCity">المدينة</label>
                    <input type="text" id="productCity" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">نشر</button>
            </form>
        </div>
        <div class="card">
            <h2>المنشورات الأخيرة</h2>
            <div id="postsContainer"></div>
        </div>
        <div class="card">
            <h2>الرادار</h2>
            <div id="radarContainer"></div>
        </div>
        <div class="card">
            <h2>المقارنة</h2>
            <div id="compareContainer"></div>
        </div>
    </div>
    <script src="app.js"></script>
    <script src="api.js"></script>
</body>
</html>
