<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نشر مباشر - أسعار ذكية</title>
  <link rel="stylesheet" href="public/style.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script>
    // Global Error Handler
    window.addEventListener('error', (e) => {
      showError(e.error || 'خطأ غير معروف', 'error');
      console.error('Global Error:', e.error);
    });
    
    window.addEventListener('unhandledrejection', (e) => {
      showError(e.reason || 'خطأ غير معالج', 'unhandled');
      console.error('Unhandled Rejection:', e.reason);
    });
    
    function showError(message, type) {
      const errorElement = document.createElement('div');
      errorElement.className = `error-message ${type}`;
      errorElement.textContent = message;
      document.body.appendChild(errorElement);
      setTimeout(() => {
        errorElement.remove();
      }, 5000);
    }
  </script>
</head>
<body>
  <div class="card">
    <div id="status" class="status">جاري الاتصال...</div>
    <input id="author" type="text" placeholder="اسمك (اختياري)" maxlength="40"/>
    <textarea id="content" rows="3" placeholder="اكتب المنشور... مثال: دجاج 25 ريال في ماركت العروبة"></textarea>
    <button id="publishBtn" type="button">نشر وحفظ</button>
  </div>

  <div class="card filter-card">
    <button class="filter-btn active" data-filter="">الكل</button>
    <button class="filter-btn" data-filter="cheap">رخيص 🟢</button>
    <button class="filter-btn" data-filter="expensive">غالي 🔴</button>
    <button id="compareBtn" class="filter-btn" title="مقارنة الأسعار">↔️</button>
    <button id="analyticsToggle" class="filter-btn" title="تحليلات">📊</button>
  </div>

  <div class="card" id="priceRadar">
    <h3>📍 رادار الفرص الذكية</h3>
    <div id="radarContent">جارٍ التحليل...</div>
  </div>

  <div class="card">
    <h3>المنشورات <span id="syncBadge" class="badge offline" title="غير مزامن">☁️</span></h3>
    <div id="posts"></div>
  </div>

  <div id="analyticsPanel" class="card hidden">
    <h3>📈 لوحة التحليل</h3>
    <canvas id="chartVolume"></canvas>
    <canvas id="chartPrice"></canvas>
  </div>

  <div id="compareOverlay" class="overlay hidden">
    <div id="compareContent" class="overlay-content">
      <button id="closeCompare" class="close-btn">×</button>
      <h3>مقارنة الأسعار</h3>
      <div id="compareResults"></div>
    </div>
  </div>
</body>
</html>
