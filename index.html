<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .identity-input {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .chat-container {
            border: 1px solid #ddd;
            border-radius: 5px;
            padding: 10px;
            background-color: white;
            height: 300px;
            overflow-y: auto;
            margin-bottom: 10px;
        }
        .message-input {
            width: 70%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .send-button {
            width: 25%;
            padding: 8px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .status-bar {
            text-align: center;
            padding: 5px;
            background-color: #f0f0f0;
            border-radius: 4px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان</h1>
            <h2>واجهة SDM</h2>
        </div>
        <div>
            <input type="text" id="user-identity" class="identity-input" placeholder="أدخل هويةك للدردشة...">
        </div>
        <div class="chat-container" id="chat-messages">
            <!-- الرسائل ستظهر هنا -->
        </div>
        <div>
            <input type="text" id="message-input" class="message-input" placeholder="اكتب رسالتك...">
            <button id="send-button" class="send-button">إرسال</button>
        </div>
        <div class="status-bar" id="connection-status">غير متصل</div>
    </div>

    <!-- تضمين الملفات الأساسية -->
    <script src="core/dom-date-guard.js"></script>
    <script src="core/local-posts-store.js"></script>
    <script src="core/render-stream.js"></script>
    <script src="ui/market-shell.js"></script>
    <script src="sdm/sdm-storage.js"></script>
    <script src="sdm/sdm-engine.js"></script>
    <script src="sdm/sdm-chat-ui.js"></script>
    <script src="sdm/sdm-render-sync.js"></script>
    <script src="sdm/sdm-shell.js"></script>
    <script src="sdm/sdm-commands.js"></script>
    <script src="sdm/sdm-addon-1.js"></script>
    <script src="sdm/sdm-addon-2.js"></script>
    <script src="sdm/sdm-addon-3.js"></script>
    <script src="sdm/sdm-addon-4.js"></script>
    <script src="sdm/sdm-addon-5.js"></script>
    <script src="sdm/sdm-addon-6.js"></script>
    <script src="sdm/sdm-addon-7.js"></script>
    <script src="sdm/sdm-addon-8.js"></script>
    <script src="sdm/sdm-addon-9.js"></script>
    <script src="sdm/sdm-addon-10.js"></script>
    <script src="sdm/sdm-addon-11.js"></script>
    <script src="sdm/sdm-addon-12.js"></script>
    <script src="sdm/sdm-addon-13.js"></script>
    <script src="sdm/sdm-addon-14.js"></script>
    <script src="sdm/sdm-addon-16.js"></script>
    <script src="sdm/sdm-addon-17.js"></script>
</body>
</html>
