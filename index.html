<!DOCTYPE html>
<html lang="ar">
<head>

    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-chat-ui.css">
</head>
<body>

        <div class="header">
            <h1>سوق السودان - واجهة SDM</h1>

        <script src="public/core/local-posts-store.js"></script>
        <script src="public/core/render-stream.js"></script>
