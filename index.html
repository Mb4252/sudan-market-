<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-addon-24.css">
    <script src="public/core/dom-date-guard.js"></script>
    <script src="public/core/local-posts-store.js"></script>
    <script src="public/core/render-stream.js"></script>
    <script src="public/sdm/sdm-storage.js"></script>
    <script src="public/sdm/sdm-engine.js"></script>
    <script src="public/sdm/sdm-chat-ui.js"></script>
    <script src="public/sdm/sdm-render-sync.js"></script>
    <script src="public/sdm/sdm-shell.js"></script>
    <script src="public/sdm/sdm-commands.js"></script>
    <script src="public/sdm/sdm-addon-24.js"></script>
    <script src="public/sdm/sdm-addon-25.js"></script>
    <script src="public/sdm/sdm-addon-26.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .identity-input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .identity-display {
            display: block;
            margin-bottom: 20px;
            padding: 10px;
            background-color: #e9e9e9;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان</h1>
            <p>واجهة SDM</p>
        </div>

        <div class="identity-section">
            <label for="user-identity-input">هويتك في الدردشة:</label>
            <input type="text" id="user-identity-input" class="identity-input" placeholder="أدخل اسمك أو معرفك">
            <span id="user-identity-display" class="identity-display">غير محدد</span>
        </div>

        <div id="chat-container">
            <!-- محتوى الدردشة سيظهر هنا -->
        </div>

        <div id="connection-status">غير متصل</div>
    </div>
</body>
</html>
