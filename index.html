<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق السودان - واجهة SDM</title>
    <link rel="stylesheet" href="public/sdm/sdm-addon-24.css">
    <script src="public/core/dom-date-guard.js"></script>
    <script src="public/core/local-posts-store.js"></script>
    <script src="public/core/render-stream.js"></script>
    <script src="public/sdm/sdm-storage.js"></script>
    <script src="public/sdm/sdm-engine.js"></script>
    <script src="public/sdm/sdm-chat-ui.js"></script>
    <script src="public/sdm/sdm-render-sync.js"></script>
    <script src="public/sdm/sdm-shell.js"></script>
    <script src="public/sdm/sdm-commands.js"></script>
    <script src="public/sdm/sdm-addon-24.js"></script>
    <script src="public/sdm/sdm-addon-25.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            direction: rtl;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .identity-input {
            width: 100%;
            padding: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>سوق السودان</h1>
            <h2>واجهة SDM</h2>
        </div>
        <div id="chat-container">
            <div class="identity-section">
                <input type="text" id="identity-input" class="identity-input" placeholder="أدخل هويةك" />
            </div>
            <div id="chat-messages"></div>
            <div class="input-section">
                <input type="text" id="message-input" placeholder="اكتب رسالتك" />
                <button id="send-button">إرسال</button>
            </div>
            <div id="connection-status"></div>
        </div>
    </div>
</body>
</html>
