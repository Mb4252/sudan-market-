name: AI Auto Fix & Feature Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  monitor-and-evolve:
    if: "!contains(github.event.head_commit.message || '', '[ai-autopilot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect Render & GitHub Actions logs and run AI updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          RENDER_LOG_URL: ${{ secrets.RENDER_LOG_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          node -e '
          const fs = require("fs");

          function failWithReason(reason) {
            console.error("❌ AI STATUS: FAILED");
            console.error("سبب الفشل:", reason);
            process.exit(1);
          }

          async function run() {
            const apiKey = (process.env.AI_API_KEY || "").trim();
            if (!apiKey) {
              failWithReason("المتغير AI_API_KEY غير موجود أو فارغ في GitHub Secrets.");
            }

            let actionsErrorLogs = "";
            try {
              const runsRes = await fetch(`https://api.github.com/repos/${process.env.REPO}/actions/runs?per_page=5`, {
                headers: {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  "User-Agent": "ai-autopilot"
                }
              });
              if (runsRes.ok) {
                const runsData = await runsRes.json();
                const failedRun = (runsData.workflow_runs || []).find(
                  r => r.conclusion === "failure" && r.name !== "AI Auto Fix & Feature Updater"
                );
                if (failedRun) {
                  const jobsRes = await fetch(failedRun.jobs_url, {
                    headers: {
                      Authorization: `Bearer ${process.env.GH_TOKEN}`,
                      "User-Agent": "ai-autopilot"
                    }
                  });
                  if (jobsRes.ok) {
                    const jobsData = await jobsRes.json();
                    actionsErrorLogs = JSON.stringify(
                      jobsData.jobs.map(j => ({ name: j.name, conclusion: j.conclusion, steps: j.steps })),
                      null,
                      2
                    ).slice(0, 6000);
                  }
                }
              }
            } catch (e) {
              actionsErrorLogs = "تعذر جلب سجلات GitHub Actions: " + e.message;
            }

            let renderLogs = "";
            if (process.env.RENDER_LOG_URL) {
              try {
                const rRes = await fetch(process.env.RENDER_LOG_URL);
                renderLogs = rRes.ok ? (await rRes.text()).slice(0, 6000) : `HTTP ${rRes.status}`;
              } catch (e) {
                renderLogs = "تعذر جلب سجلات Render: " + e.message;
              }
            }

            const currentFiles = ["server.js", "index.html", "package.json"]
              .filter(f => fs.existsSync(f))
              .map(f => `--- FILE: ${f} ---\n${fs.readFileSync(f, "utf8")}`)
              .join("\n\n");

            const prompt = [
              "أنت مهندس برمجيات ذاتي التنفيذ. راجع سجلات GitHub Actions وسجلات Render الحالية.",
              "1) إذا وُجد خطأ في أي من السجلين، أصلحه فوراً.",
              "2) أضف تحسيناً أو ميزة جديدة مفيدة في الكود دون كسر الوظيفة الأساسية (Render يبث فقط عبر WebSocket ولا يخزن منشورات، والمتصفح يخزن محلياً في localStorage).",
              "3) أعد النتيجة بصيغة JSON صالحة فقط بدون أي نص خارج JSON بهذا الشكل الدقيق:",
              "{\"files\":{\"server.js\":\"...\",\"index.html\":\"...\"},\"summary\":\"...\"}",
              "",
              "=== GITHUB ACTIONS ERROR LOGS ===",
              actionsErrorLogs || "No failed workflow logs found.",
              "",
              "=== RENDER LOGS ===",
              renderLogs || "No external Render log URL configured.",
              "",
              "=== CURRENT CODE ===",
              currentFiles
            ].join("\n");

            let provider = "";
            let url = "";
            let headers = { "Content-Type": "application/json" };
            let body = {};

            if (apiKey.startsWith("gsk_")) {
              provider = "Groq (llama-3.3-70b-versatile)";
              url = "https://api.groq.com/openai/v1/chat/completions";
              headers["Authorization"] = `Bearer ${apiKey}`;
              body = {
                model: "llama-3.3-70b-versatile",
                messages: [{ role: "user", content: prompt }],
                response_format: { type: "json_object" },
                temperature: 0.3
              };
            } else if (apiKey.startsWith("sk-or-")) {
              provider = "OpenRouter (free model)";
              url = "https://openrouter.ai/api/v1/chat/completions";
              headers["Authorization"] = `Bearer ${apiKey}`;
              headers["HTTP-Referer"] = `https://github.com/${process.env.REPO}`;
              body = {
                model: "meta-llama/llama-3.3-70b-instruct:free",
                messages: [{ role: "user", content: prompt }],
                temperature: 0.3
              };
            } else {
              provider = "Gemini (gemini-2.5-flash)";
              url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
              body = {
                contents: [{ parts: [{ text: prompt }] }],
                generationConfig: { responseMimeType: "application/json" }
              };
            }

            console.log("🔌 المزود المختار:", provider);

            let aiRes;
            try {
              aiRes = await fetch(url, {
                method: "POST",
                headers,
                body: JSON.stringify(body)
              });
            } catch (e) {
              failWithReason(`فشل الاتصال بـ ${provider}: ${e.message}`);
            }

            const rawBody = await aiRes.text();
            let aiJson;
            try {
              aiJson = JSON.parse(rawBody);
            } catch (e) {
              failWithReason(`رد ${provider} ليس JSON صالحاً (HTTP ${aiRes.status}): ${rawBody.slice(0, 400)}`);
            }

            if (!aiRes.ok || aiJson.error) {
              const errMsg = aiJson?.error?.message || JSON.stringify(aiJson?.error || rawBody).slice(0, 400);
              failWithReason(`رفض ${provider} الطلب (HTTP ${aiRes.status}): ${errMsg}`);
            }

            let rawText = "";
            if (apiKey.startsWith("gsk_") || apiKey.startsWith("sk-or-")) {
              rawText = aiJson?.choices?.[0]?.message?.content || "";
            } else {
              rawText = aiJson?.candidates?.[0]?.content?.parts?.[0]?.text || "";
            }

            if (!rawText.trim()) {
              failWithReason(`${provider} استجاب لكن أعاد نصاً فارغاً.`);
            }

            rawText = rawText.replace(/^```json\s*/i, "").replace(/```\s*$/i, "").trim();

            let parsed;
            try {
              parsed = JSON.parse(rawText);
            } catch (e) {
              failWithReason(`فشل تحليل JSON من ${provider}: ${e.message} | النص: ${rawText.slice(0, 300)}`);
            }

            console.log(`✅ AI STATUS: WORKING (${provider})`);
            console.log("ملخص التحديث:", parsed.summary || "تم الفحص دون ملخص");

            let updatedCount = 0;
            if (parsed.files && typeof parsed.files === "object") {
              for (const [filePath, content] of Object.entries(parsed.files)) {
                if (typeof content === "string" && content.trim().length > 0 && !filePath.includes("..")) {
                  const prevContent = fs.existsSync(filePath) ? fs.readFileSync(filePath, "utf8") : "";
                  if (prevContent !== content) {
                    fs.writeFileSync(filePath, content, "utf8");
                    updatedCount++;
                    console.log(`📝 تم تحديث الملف: ${filePath}`);
                  }
                }
              }
            }

            console.log(`عدد الملفات التي تغيّر محتواها: ${updatedCount}`);
            fs.writeFileSync("last_ai_change.txt", parsed.summary || "Automated update and fix", "utf8");
          }

          run();
          '

      - name: Commit and push changes automatically
        run: |
          git config user.name "ai-autopilot[bot]"
          git config user.email "ai-autopilot[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            SUMMARY=$(head -n 1 last_ai_change.txt || echo "Automated update and fix")
            rm -f last_ai_change.txt
            git add -A
            git commit -m "[ai-autopilot] ${SUMMARY}"
            if git push origin HEAD; then
              echo "✅ PUSH STATUS: تم رفع التعديلات إلى GitHub بنجاح."
              if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
                curl -s -X POST "${RENDER_DEPLOY_HOOK_URL}" || true
              fi
            else
              echo "❌ PUSH STATUS: فشل رفع التعديلات (git push)."
              exit 1
            fi
          else
            rm -f last_ai_change.txt
            echo "ℹ️ لا توجد تغييرات جديدة لرفعها في هذه الدورة."
          fi
