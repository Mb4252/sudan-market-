import fs from "node:fs";
import path from "node:path";

const GROQ_API_KEY = process.env.GROQ_API_KEY;
if (!GROQ_API_KEY) {
  console.error("❌ GROQ_API_KEY is missing in environment variables.");
  process.exit(1);
}

// النموذج الأساسي ونموذج احتياطي أصغر لتجنب ضغط TPM عند الحاجة
const PRIMARY_MODEL = process.env.GROQ_MODEL || "openai/gpt-oss-120b";
const FALLBACK_MODEL = process.env.GROQ_FALLBACK_MODEL || "llama-3.1-8b-instant";

// حد تقريبي آمن بالأحرف (~1 token ≈ 3.5–4 chars للعربي والإنجليزي والـ JSON)
// 8000 TPM حد المنظمة؛ نبدأ بحد آمن ~11,000 حرف (~2,800–3,500 توكن) مع ترك مساحة للـ prompt والرد
const INITIAL_MAX_CHARS = Number(process.env.MAX_LOG_CHARS || 11000);
const MAX_LINES_PER_LOG = Number(process.env.MAX_LOG_LINES || 150);

function readAndTrimLog(filePath, maxLines = MAX_LINES_PER_LOG) {
  try {
    if (!filePath || !fs.existsSync(filePath)) return "";
    const raw = fs.readFileSync(filePath, "utf8");
    const lines = raw
      .split(/\r?\n/)
      .map((line) => line.trim())
      .filter((line) => line.length > 0);

    // نأخذ آخر الأسطر لأن الأخطاء غالباً في نهاية السجل
    const tail = lines.slice(-maxLines);
    return tail.join("\n");
  } catch (err) {
    return `[Failed to read ${filePath}: ${err.message}]`;
  }
}

function sanitizeText(text, maxChars) {
  if (!text) return "";
  // إزالة تكرار المسافات الفارغة الزائدة وتقصير النص من البداية (الاحتفاظ بالنهاية الأقرب للخطأ)
  const cleaned = text.replace(/\n{3,}/g, "\n\n").trim();
  if (cleaned.length <= maxChars) return cleaned;
  return "[...trimmed older logs...]\n" + cleaned.slice(-maxChars);
}

function buildMessages(renderLog, actionsLog, repoSummary, charBudget) {
  const halfBudget = Math.floor(charBudget * 0.42);
  const repoBudget = Math.floor(charBudget * 0.16);

  const trimmedRender = sanitizeText(renderLog, halfBudget);
  const trimmedActions = sanitizeText(actionsLog, halfBudget);
  const trimmedRepo = sanitizeText(repoSummary, repoBudget);

  const systemPrompt = [
    "You are a concise CI/CD and code diagnostic assistant.",
    "Analyze the provided Render and GitHub Actions logs and return a brief, actionable fix summary in Arabic.",
    "Keep the response focused, clear, and under 400 words."
  ].join(" ");

  const userContent = [
    "=== RENDER LOGS (TAIL) ===",
    trimmedRender || "No Render logs found.",
    "",
    "=== GITHUB ACTIONS LOGS (TAIL) ===",
    trimmedActions || "No GitHub Actions logs found.",
    trimmedRepo ? `\n=== REPO CONTEXT ===\n${trimmedRepo}` : ""
  ].join("\n");

  return [
    { role: "system", content: systemPrompt },
    { role: "user", content: userContent }
  ];
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

async function callGroqChat(messages, model) {
  const res = await fetch("https://api.groq.com/openai/v1/chat/completions", {
    method: "POST",
    headers: {
      Authorization: `Bearer ${GROQ_API_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      model,
      messages,
      temperature: 0.2,
      max_tokens: 900
    })
  });

  const text = await res.text();
  let parsed;
  try {
    parsed = JSON.parse(text);
  } catch {
    parsed = null;
  }

  if (!res.ok) {
    const errMsg = parsed?.error?.message || text || `HTTP ${res.status}`;
    const err = new Error(`HTTP ${res.status}: ${errMsg}`);
    err.status = res.status;
    throw err;
  }

  return parsed?.choices?.[0]?.message?.content || "";
}

async function runWithSmartTrimming(renderLog, actionsLog, repoSummary) {
  let charBudget = INITIAL_MAX_CHARS;
  let currentModel = PRIMARY_MODEL;
  const maxAttempts = 5;

  for (let attempt = 1; attempt <= maxAttempts; attempt++) {
    const messages = buildMessages(renderLog, actionsLog, repoSummary, charBudget);
    console.log(
      `Attempt ${attempt}/${maxAttempts} | model=${currentModel} | charBudget=${charBudget}`
    );

    try {
      const reply = await callGroqChat(messages, currentModel);
      return reply;
    } catch (err) {
      console.warn(`⚠️ Attempt ${attempt} failed: ${err.message}`);

      // إذا كان الخطأ 413 (الطلب أكبر من الحد)، نقلّص السجلات بنسبة 35% ونحاول مجدداً
      if (err.status === 413) {
        charBudget = Math.max(1500, Math.floor(charBudget * 0.65));
        if (attempt >= 2) {
          currentModel = FALLBACK_MODEL;
        }
        await sleep(1500);
        continue;
      }

      // إذا كان 429 (تجاوز Rate Limit مؤقت)، ننتظر قليلاً ونغيّر للنموذج الاحتياطي بعد المحاولة الثانية
      if (err.status === 429) {
        if (attempt >= 2) {
          currentModel = FALLBACK_MODEL;
        }
        await sleep(4000 * attempt);
        continue;
      }

      // أخطاء أخرى غير قابلة لإعادة المحاولة
      throw err;
    }
  }

  throw new Error("Exhausted retry attempts due to token/rate limits.");
}

async function main() {
  const renderLog =
    process.env.RENDER_LOG_TEXT || readAndTrimLog(path.resolve("render.log"));
  const actionsLog =
    process.env.ACTIONS_LOG_TEXT || readAndTrimLog(path.resolve("actions.log"));
  const repoSummary = process.env.REPO_CONTEXT || "";

  const output = await runWithSmartTrimming(renderLog, actionsLog, repoSummary);

  fs.mkdirSync("artifacts", { recursive: true });
  fs.writeFileSync("artifacts/ai-report.md", output, "utf8");

  console.log("\n✅ AI Report generated successfully:\n");
  console.log(output);
}

main().catch((err) => {
  console.error("❌ Fatal error:", err.message);
  process.exit(1);
});
