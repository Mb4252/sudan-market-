name: AI Auto Fix & Feature Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  monitor-and-evolve:
    if: "!contains(github.event.head_commit.message || '', '[ai-autopilot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect diagnostics, run multi-AI updater, and verify live site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PAGES_URL: "https://mb4252.github.io/sudan-market-/"
          RENDER_URL: ${{ secrets.RENDER_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function failWithReason(reason) {
            console.error("❌ AI STATUS: FAILED");
            console.error("سبب الفشل:", reason);
            process.exit(1);
          }

          function sanitizeUrl(rawUrl) {
            let u = String(rawUrl || "").trim();
            const mdMatch = u.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
            if (mdMatch) {
              u = (mdMatch[2] || mdMatch[1] || "").trim();
            }
            return u.replace(/^<|>$/g, "").trim();
          }

          function collectProjectFiles(dir = ".", depth = 0, out = []) {
            if (depth > 2) return out;
            const ignore = new Set(["node_modules", ".git", ".github"]);
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignore.has(entry.name)) continue;
              const fullPath = path.join(dir, entry.name).replace(/\\/g, "/");
              if (entry.isDirectory()) {
                collectProjectFiles(fullPath, depth + 1, out);
              } else if (/\.(js|html|css|json)$/i.test(entry.name)) {
                const content = fs.readFileSync(fullPath, "utf8");
                const clipped = content.length > 2300
                  ? content.slice(0, 2300) + "\n/* ...مقتطع للاختصار... */"
                  : content;
                out.push({ fullPath, raw: content, content: clipped });
              }
            }
            return out;
          }

          async function probeLiveEndpoints(pagesUrl, renderUrl) {
            const lines = [];
            try {
              const res = await fetch(sanitizeUrl(pagesUrl), { signal: AbortSignal.timeout(10000) });
              const html = await res.text();
              const scriptSrcs = [...html.matchAll(/<script[^>]+src=["'\'']([^"'\'']+)["'\'']/gi)].map(m => m[1]);
              const hasBrokenLocalSrc = scriptSrcs.some(src => /^\/(?!sudan-market-)/.test(src));
              lines.push(`صفحة GitHub Pages (${pagesUrl}): HTTP ${res.status} | عدد السكربتات: ${scriptSrcs.length} (${scriptSrcs.join(", ") || "لا يوجد"})`);
              if (hasBrokenLocalSrc) {
                lines.push("⚠️ تحذير مسار: يوجد رابط سكربت يبدأ بـ / قد ينكسر تحت مسار GitHub Pages الفرعي؛ استخدم مسارات نسبية مثل ./public/...");
              }
              if (/جاري الاتصال\.\.\./.test(html) && !/bridgeStatus|statusText|connectionStatus/i.test(html)) {
                lines.push("⚠️ نص ثابت (جاري الاتصال...) موجود في HTML دون مؤشر حالة ديناميكي واضح.");
              }
            } catch (e) {
              lines.push(`تعذر فحص صفحة GitHub Pages (${pagesUrl}): ${e.message}`);
            }

            if (renderUrl) {
              const base = sanitizeUrl(renderUrl).replace(/\/+$/, "");
              try {
                const hRes = await fetch(`${base}/health`, { signal: AbortSignal.timeout(12000) });
                const hTxt = await hRes.text();
                lines.push(`جسر Render (${base}/health): HTTP ${hRes.status} | الرد: ${hTxt.slice(0, 120)}`);
              } catch (e) {
                lines.push(`جسر Render (${base}/health): غير مستجيب حالياً (${e.message}) — يجب أن يعمل الحفظ والنشر محلياً فوراً دون انتظار Render.`);
              }
            }
            return lines.join("\n");
          }

          function runSelfDiagnostics(filesList, renderUrl) {
            const issues = [];
            const htmlFile = filesList.find(f => f.fullPath === "index.html");
            const jsFiles = filesList.filter(f => f.fullPath.endsWith(".js") && f.fullPath !== "server.js");

            if (!htmlFile) {
              issues.push("ملف index.html مفقود في الجذر.");
              return issues.join("\n");
            }

            const htmlIds = new Set([...htmlFile.raw.matchAll(/\bid=["'\'']([^"'\'']+)["'\'']/g)].map(m => m[1]));
            const allJsRaw = jsFiles.map(f => f.raw).join("\n");

            if (/YOUR-SERVICE|example\.onrender\.com/i.test(allJsRaw + htmlFile.raw)) {
              issues.push("يوجد رابط Render وهمي غير حقيقي في الكود يمنع الاتصال من GitHub Pages.");
            }
            if (/location\.host/.test(allJsRaw) && !/onrender\.com/.test(allJsRaw)) {
              issues.push("الكود يستخدم location.host للـ WebSocket مما يجعله يتصل بـ github.io بدلاً من Render!");
            }

            const referencedIds = [...allJsRaw.matchAll(/getElementById\(["'\'']([^"'\'']+)["'\'']\)/g)].map(m => m[1]);
            const missingIds = [...new Set(referencedIds.filter(id => !htmlIds.has(id)))];
            if (missingIds.length) {
              issues.push(`معرّفات DOM مفقودة في index.html وتسبب توقف السكربت بصمت: ${missingIds.join(", ")}`);
            }

            if (!/localStorage/.test(allJsRaw)) {
              issues.push("التخزين المحلي localStorage غير مفعّل بشكل واضح عند النشر.");
            }

            if (!/window\.addEventListener\(["'\'']error["'\'']|onunhandledrejection/.test(allJsRaw + htmlFile.raw)) {
              issues.push("لا يوجد ملتقط أخطاء عام (window.onerror / unhandledrejection) يظهر الخطأ بوضوح في الواجهة واللوغو.");
            }

            return issues.length
              ? issues.map((x, i) => `${i + 1}. ${x}`).join("\n")
              : "لا توجد أخطاء بنيوية واضحة في الفحص الساكن، ركّز على تحسين تجربة النشر الفوري وميزات خارج الصندوق.";
          }

          async function getGroqModelsOrdered(apiKey) {
            const fallbackModels = [
              "llama-3.3-70b-versatile",
              "openai/gpt-oss-120b",
              "llama-3.1-8b-instant",
              "openai/gpt-oss-20b"
            ];

            try {
              const modelsUrl = sanitizeUrl("https://api.groq.com/openai/v1/models");
              const res = await fetch(modelsUrl, {
                headers: { Authorization: `Bearer ${apiKey}` }
              });
              if (!res.ok) return fallbackModels;
              const data = await res.json();
              const ids = (data.data || [])
                .map(m => m.id)
                .filter(id => id && !/whisper|tts|guard|prompt-guard|safeguard|embed|allam|orpheus/i.test(id));

              const ordered = [];
              for (const p of fallbackModels) {
                if (ids.includes(p) && !ordered.includes(p)) ordered.push(p);
              }
              for (const id of ids) {
                if (!ordered.includes(id)) ordered.push(id);
              }
              for (const p of fallbackModels) {
                if (!ordered.includes(p)) ordered.push(p);
              }
              return ordered.length ? ordered : fallbackModels;
            } catch {
              return fallbackModels;
            }
          }

          function tryRepairJson(candidate) {
            let s = String(candidate || "").trim();
            const firstBrace = s.indexOf("{");
            if (firstBrace > 0) s = s.slice(firstBrace);
            const lastBrace = s.lastIndexOf("}");
            if (lastBrace !== -1) s = s.slice(0, lastBrace + 1);

            let inString = false;
            let escaped = false;
            let openBraces = 0;

            for (let i = 0; i < s.length; i++) {
              const ch = s[i];
              if (escaped) { escaped = false; continue; }
              if (ch === "\\") { escaped = true; continue; }
              if (ch === "\"") { inString = !inString; continue; }
              if (!inString) {
                if (ch === "{") openBraces++;
                else if (ch === "}") openBraces = Math.max(0, openBraces - 1);
              }
            }

            if (escaped) s = s.slice(0, -1);
            if (inString) s += "\"";
            while (openBraces > 0) { s += "}"; openBraces--; }

            return JSON.parse(s);
          }

          function extractJsonObject(text) {
            const cleaned = String(text || "")
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/```\s*$/i, "")
              .trim();

            try {
              return JSON.parse(cleaned);
            } catch {
              const start = cleaned.indexOf("{");
              const end = cleaned.lastIndexOf("}");
              if (start !== -1 && end !== -1 && end > start) {
                try {
                  return JSON.parse(cleaned.slice(start, end + 1));
                } catch {
                  return tryRepairJson(cleaned);
                }
              }
              return tryRepairJson(cleaned);
            }
          }

          async function callChatCompletion(targetUrl, targetHeaders, payloadBody) {
            const cleanUrl = sanitizeUrl(targetUrl);
            const res = await fetch(cleanUrl, {
              method: "POST",
              headers: targetHeaders,
              body: JSON.stringify(payloadBody)
            });
            const txt = await res.text();
            let jsonData;
            try {
              jsonData = JSON.parse(txt);
            } catch {
              const err = new Error(`الرد ليس JSON صالحاً (HTTP ${res.status}): ${txt.slice(0, 350)}`);
              err.status = res.status;
              throw err;
            }
            if (!res.ok || jsonData.error) {
              const msg = jsonData?.error?.message || JSON.stringify(jsonData?.error || txt).slice(0, 350);
              const err = new Error(`HTTP ${res.status}: ${msg}`);
              err.status = res.status;
              throw err;
            }
            return jsonData;
          }

          async function callOpenRouterWithRetry(key, sysPrompt, usrPrompt, maxTokens) {
            const url = sanitizeUrl("[https://openrouter.ai/api/v1/chat/completions](https://openrouter.ai/api/v1/chat/completions)");
            const headers = {
              "Content-Type": "application/json",
              Authorization: `Bearer ${key}`,
              "HTTP-Referer": `[https://github.com/$](https://github.com/$){process.env.REPO}`,
              "X-Title": "sudan-market-autopilot"
            };
            const body = {
              model: "openrouter/free",
              messages: [
                { role: "system", content: sysPrompt },
                { role: "user", content: usrPrompt }
              ],
              max_tokens: maxTokens,
              temperature: 0.5
            };

            let lastErr = null;
            for (let attempt = 1; attempt <= 2; attempt++) {
              try {
                const data = await callChatCompletion(url, headers, body);
                const out = data?.choices?.[0]?.message?.content || "";
                if (!out.trim()) throw new Error("رد فارغ من OpenRouter");
                return out;
              } catch (e) {
                lastErr = e;
                if (e.status === 429) break;
                if (attempt < 2) await new Promise(r => setTimeout(r, 1200));
              }
            }
            throw lastErr || new Error("فشل OpenRouter");
          }

          async function callMistral(key, sysPrompt, usrPrompt, maxTokens, jsonMode = false) {
            const url = sanitizeUrl("[https://api.mistral.ai/v1/chat/completions](https://api.mistral.ai/v1/chat/completions)");
            const headers = {
              "Content-Type": "application/json",
              Authorization: `Bearer ${key}`
            };
            const models = ["codestral-latest", "mistral-small-latest", "open-mistral-nemo"];
            let lastErr = null;

            for (const m of models) {
              try {
                const body = {
                  model: m,
                  messages: [
                    { role: "system", content: sysPrompt },
                    { role: "user", content: usrPrompt }
                  ],
                  max_tokens: maxTokens,
                  temperature: 0.5
                };
                if (jsonMode && m !== "codestral-latest") {
                  body.response_format = { type: "json_object" };
                }
                const data = await callChatCompletion(url, headers, body);
                const out = data?.choices?.[0]?.message?.content || "";
                if (!out.trim()) throw new Error(`رد فارغ من Mistral (${m})`);
                return { text: out, detail: `Mistral (${m})` };
              } catch (e) {
                lastErr = e;
                console.warn(`⚠️ نموذج Mistral (${m}) تعذر: ${e.message}`);
                continue;
              }
            }
            throw lastErr || new Error("فشل جميع نماذج Mistral");
          }

          function buildProviders(primaryKey, openRouterKey, mistralKey) {
            const list = [];
            const seen = new Set();

            if (mistralKey) {
              seen.add(mistralKey);
              list.push({
                id: "mistral",
                label: "Mistral AI",
                runText: async (sysPrompt, usrPrompt, maxTokens = 700) => {
                  return await callMistral(mistralKey, sysPrompt, usrPrompt, maxTokens, false);
                },
                runJson: async (sysPrompt, usrPrompt, maxTokens = 2900) => {
                  const res = await callMistral(mistralKey, sysPrompt, usrPrompt, maxTokens, true);
                  return { parsed: extractJsonObject(res.text), detail: res.detail };
                }
              });
            }

            const otherKeys = [primaryKey, openRouterKey].map(k => (k || "").trim()).filter(Boolean);
            for (const key of otherKeys) {
              if (seen.has(key)) continue;
              seen.add(key);

              if (key.startsWith("gsk_")) {
                list.push({
                  id: "groq",
                  label: "Groq",
                  runText: async (sysPrompt, usrPrompt, maxTokens = 700) => {
                    const models = await getGroqModelsOrdered(key);
                    const groqUrl = sanitizeUrl("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)");
                    const headers = { "Content-Type": "application/json", Authorization: `Bearer ${key}` };
                    let lastErr = null;
                    for (const m of models) {
                      try {
                        const data = await callChatCompletion(groqUrl, headers, {
                          model: m,
                          messages: [
                            { role: "system", content: sysPrompt },
                            { role: "user", content: usrPrompt }
                          ],
                          max_tokens: maxTokens,
                          temperature: 0.5
                        });
                        const out = data?.choices?.[0]?.message?.content || "";
                        if (!out.trim()) throw new Error("رد فارغ");
                        return { text: out, detail: `Groq (${m})` };
                      } catch (e) {
                        lastErr = e;
                        console.warn(`⚠️ نموذج Groq (${m}) تعذر: ${e.message}`);
                        continue;
                      }
                    }
                    throw lastErr || new Error("فشل نماذج Groq");
                  },
                  runJson: async (sysPrompt, usrPrompt, maxTokens = 2900) => {
                    const models = await getGroqModelsOrdered(key);
                    const groqUrl = sanitizeUrl("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)");
                    const headers = { "Content-Type": "application/json", Authorization: `Bearer ${key}` };
                    let lastErr = null;
                    for (const m of models) {
                      try {
                        let data;
                        try {
                          data = await callChatCompletion(groqUrl, headers, {
                            model: m,
                            messages: [
                              { role: "system", content: sysPrompt },
                              { role: "user", content: usrPrompt }
                            ],
                            response_format: { type: "json_object" },
                            max_tokens: maxTokens,
                            temperature: 0.5
                          });
                        } catch (jErr) {
                          if (jErr.status === 429 || jErr.status === 400) throw jErr;
                          data = await callChatCompletion(groqUrl, headers, {
                            model: m,
                            messages: [
                              { role: "system", content: sysPrompt },
                              { role: "user", content: usrPrompt }
                            ],
                            max_tokens: maxTokens,
                            temperature: 0.5
                          });
                        }
                        const raw = data?.choices?.[0]?.message?.content || "";
                        if (!raw.trim()) throw new Error("رد فارغ");
                        return { parsed: extractJsonObject(raw), detail: `Groq (${m})` };
                      } catch (e) {
                        lastErr = e;
                        console.warn(`⚠️ نموذج Groq (${m}) تعذر في JSON: ${e.message}`);
                        continue;
                      }
                    }
                    throw lastErr || new Error("فشل توليد JSON من Groq");
                  }
                });
              } else if (key.startsWith("sk-or-")) {
                list.push({
                  id: "openrouter",
                  label: "OpenRouter (ChatGPT-style partner)",
                  runText: async (sysPrompt, usrPrompt, maxTokens = 700) => {
                    const out = await callOpenRouterWithRetry(key, sysPrompt, usrPrompt, maxTokens);
                    return { text: out, detail: "OpenRouter (openrouter/free)" };
                  },
                  runJson: async (sysPrompt, usrPrompt, maxTokens = 2900) => {
                    const raw = await callOpenRouterWithRetry(key, sysPrompt, usrPrompt, maxTokens);
                    return { parsed: extractJsonObject(raw), detail: "OpenRouter (openrouter/free)" };
                  }
                });
              }
            }
            return list;
          }

          async function run() {
            const primaryKey = (process.env.AI_API_KEY || "").trim();
            const openRouterKey = (process.env.OPENROUTER_API_KEY || "").trim();
            const mistralKey = (process.env.MISTRAL_API_KEY || "").trim();
            const pagesUrl = sanitizeUrl(process.env.PAGES_URL || "[https://mb4252.github.io/sudan-market-/](https://mb4252.github.io/sudan-market-/)");
            const renderUrl = sanitizeUrl(process.env.RENDER_URL || "[https://sudan-market-2.onrender.com](https://sudan-market-2.onrender.com)");
            const providers = buildProviders(primaryKey, openRouterKey, mistralKey);

            if (!providers.length) {
              failWithReason("لا يوجد أي مفتاح API صالح في Secrets.");
            }

            const filesList = collectProjectFiles(".");
            const staticReport = runSelfDiagnostics(filesList, renderUrl);
            const liveReport = await probeLiveEndpoints(pagesUrl, renderUrl);
            const diagnosticReport = `${staticReport}\n\n--- فحص الموقع الحي والجسر ---\n${liveReport}`;
            console.log("🩺 تقرير التشخيص الشامل (الثابت والحي):\n" + diagnosticReport);

            const currentFiles = filesList
              .map(f => `--- FILE: ${f.fullPath} ---\n${f.content}`)
              .join("\n\n")
              .slice(0, 6500);

            const architectureMandate = [
              `رابط GitHub Pages المعتمد: ${pagesUrl}`,
              `رابط جسر Render المعتمد: ${renderUrl} (للبث المباشر WebSocket عبر wss:// وطلب الإيقاظ /health فقط).`,
              "1) النشر والحفظ المحلي الفوري (Local-First بلا تعليق): عند ضغط زر النشر، احفظ المنشور فوراً في localStorage حتى لو كان النص حراً أو بدون رقم صريح أو كان Render نائماً، وحدّث قائمة المنشورات ورادار الأسعار ولوحة التحليل في نفس اللحظة، وأظهر رسالة تأكيد أو خطأ واضحة في اللوغو والواجهة بدلاً من الصمت أو التعليق.",
              "2) واجهة نظيفة بلا تداخل أزرار أو نصوص عالقة: تأكد من عدم تراكب الأزرار، وأن حالة الاتصال تتحدث بوضوح (متصل بالجسر / وضع محلي سريع) دون بقاء (جاري الاتصال...) أو (جارِ التحليل...) عالقة للأبد.",
              "3) إظهار الأخطاء وتشخيصها: أضف ملتقط أخطاء عام (window.onerror و unhandledrejection) يطبع الخطأ في اللوغو ويعرضه للمستخدم ليسهل تتبعه وإصلاحه.",
              "4) أفكار مبتكرة خارج الصندوق (غير تقليدية): صمّم (رادار الفرص وفروق الأسعار) لاستخراج السعر والسلعة والمكان تلقائياً من النص الحر واكتشاف أرخص مكان مقابل الأغلى وحساب نسبة التوفير ومؤشر تذبذب السعر بطريقة ذكية ومختصرة."
            ].join("\n");

            let agreedPlan = "";
            let activeExecutor = null;

            if (providers.length >= 2) {
              const p1 = providers[0];
              const p2 = providers[1];
              console.log(`🤝 حوار التشخيص والابتكار نشط بين: [${p1.label}] و [${p2.label}]`);

              try {
                const propRes = await p1.runText(
                  "أنت مهندس تشخيص ومبتكر منتجات غير تقليدية. اشرح سبب تعليق النشر أو تداخل الأزرار من التقرير، واقترح ميزة ذكية خارج الصندوق وفحصاً واضحاً للأخطاء.",
                  `التقرير:\n${diagnosticReport}\n\nالقواعد:\n${architectureMandate}\n\nالملفات:\n${currentFiles}`,
                  680
                );
                console.log(`💡 مقترح ${propRes.detail} جاهز للمراجعة.`);

                try {
                  const revRes = await p2.runText(
                    "أنت المدقق الهندسي والمشارك الثاني. راجع المقترح، تحقق من عدم وجود أزرار متراكبة أو تعليق عند النشر، وتأكد من ظهور الأخطاء بوضوح، ثم اكتب [اتفقنا] متبوعاً بالخطة النهائية.",
                    `مقترح الطرف الأول:\n${propRes.text}\n\nالتقرير:\n${diagnosticReport}\n\n${architectureMandate}`,
                    700
                  );
                  agreedPlan = revRes.text;
                  activeExecutor = p2;
                  console.log(`✅ تم الاتفاق بين الطرفين عبر ${revRes.detail}.`);
                } catch (revErr) {
                  console.warn(`⚠️ تعذرت مراجعة الطرف الثاني (${revErr.message}) — يكمل الطرف الأول التنفيذ مباشرة.`);
                  agreedPlan = `[اتفاق مباشر]\n${propRes.text}`;
                  activeExecutor = p1;
                }
              } catch (propErr) {
                console.warn(`⚠️ تعذر الطرف الأول (${propErr.message}) — ينتقل الطرف الثاني للعمل المستقل الفوري.`);
                const soloRes = await p2.runText(
                  "أنت المنفذ المستقل. ضع خطة فورية لحل التعليق، إظهار الأخطاء في اللوغو، وإضافة ميزة خارج الصندوق.",
                  `التقرير:\n${diagnosticReport}\n\n${architectureMandate}\n\nالملفات:\n${currentFiles}`,
                  680
                );
                agreedPlan = `[عمل مستقل فوري]\n${soloRes.text}`;
                activeExecutor = p2;
              }
            } else {
              activeExecutor = providers[0];
              agreedPlan = `أصلح المشاكل التالية وأضف تطويراً خارج الصندوق:\n${diagnosticReport}`;
            }

            const systemJsonInstruction = [
              "أنت مهندس برمجيات ومصمم واجهات محترف.",
              "أعد كائن JSON صالحاً فقط بدون أي نص خارج JSON، وبصيغة الهروب الصحيحة.",
              "الشكل المطلوب بدقة: {\"files\":{\"مسار_الملف\":\"محتواه_الكامل\"},\"summary\":\"ملخص واضح ومختصر\"}"
            ].join("\n");

            const executionPrompt = [
              "نفّذ الخطة المتفق عليها بدقة وتأكد من سلامة index.html وملفات public/:",
              agreedPlan,
              "",
              "=== التقرير التشخيصي ===",
              diagnosticReport,
              "",
              architectureMandate,
              "",
              "=== CURRENT FILES ===",
              currentFiles
            ].join("\n");

            let execResult = null;
            const orderedExecutors = [activeExecutor, ...providers.filter(pr => pr !== activeExecutor)].filter(Boolean);
            let lastExecErr = null;

            for (const execProvider of orderedExecutors) {
              try {
                execResult = await execProvider.runJson(systemJsonInstruction, executionPrompt, 2900);
                lastExecErr = null;
                break;
              } catch (e) {
                lastExecErr = e;
                console.warn(`⚠️ تعذر التنفيذ عبر ${execProvider.label} (${e.message}) — انتقال فوري للمزود التالي.`);
              }
            }

            if (!execResult || !execResult.parsed) {
              failWithReason(`فشل التوليد من جميع المزودين: ${lastExecErr ? lastExecErr.message : "خطأ غير معروف"}`);
            }

            const parsed = execResult.parsed;
            console.log(`✅ AI STATUS: WORKING (${execResult.detail})`);
            console.log("ملخص التحديث:", parsed.summary || "تم التطوير والمعالجة");

            let updatedCount = 0;
            if (parsed.files && typeof parsed.files === "object") {
              for (const [filePath, content] of Object.entries(parsed.files)) {
                const cleanPath = String(filePath).replace(/^\/+/, "").trim();
                if (!cleanPath || cleanPath.includes("..") || typeof content !== "string" || !content.trim()) continue;
                if (cleanPath.endsWith(".json")) {
                  try { JSON.parse(content); } catch { continue; }
                }
                const dirName = path.dirname(cleanPath);
                if (dirName && dirName !== ".") fs.mkdirSync(dirName, { recursive: true });
                const prevContent = fs.existsSync(cleanPath) ? fs.readFileSync(cleanPath, "utf8") : "";
                if (prevContent !== content) {
                  fs.writeFileSync(cleanPath, content, "utf8");
                  updatedCount++;
                  console.log(`📝 تم تحديث/إنشاء الملف: ${cleanPath}`);
                }
              }
            }

            console.log(`عدد الملفات التي تغيّر محتواها: ${updatedCount}`);
            if (updatedCount > 0) {
              fs.writeFileSync("last_ai_change.txt", String(parsed.summary || "Fix publish hang, error log & smart radar").replace(/[\r\n]+/g, " ").slice(0, 120), "utf8");
            }
          }

          run();
          '

      - name: Commit, push, and verify live site
        env:
          REPO: ${{ github.repository }}
          PAGES_URL: "[https://mb4252.github.io/sudan-market-/](https://mb4252.github.io/sudan-market-/)"
          RENDER_URL: ${{ secrets.RENDER_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "ai-autopilot[bot]"
          git config user.email "ai-autopilot[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            rm -f last_ai_change.txt
            echo "ℹ️ nothing to commit, working tree clean."
            exit 0
          fi
          SUMMARY="Fix publish hang, error log & smart radar"
          if [ -f last_ai_change.txt ]; then
            SUMMARY=$(head -n 1 last_ai_change.txt)
            rm -f last_ai_change.txt
            git add -A
          fi
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "[ai-autopilot] ${SUMMARY}"
          git push origin HEAD
          echo "✅ PUSH STATUS: تم رفع التعديلات إلى GitHub بنجاح."
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            curl -s -X POST "${RENDER_DEPLOY_HOOK_URL}" || true
          fi
          echo "⏳ انتظار نشر التحديث على GitHub Pages للفحص..."
          sleep 35
          TARGET_PAGES_URL="${PAGES_URL:-[https://mb4252.github.io/sudan-market-/](https://mb4252.github.io/sudan-market-/)}"
          CODE=$(curl -sL -m 15 -o /tmp/pages_check.html -w "%{http_code}" "${TARGET_PAGES_URL}" || echo "000")
          echo "🌐 فحص ما بعد النشر (${TARGET_PAGES_URL}): HTTP ${CODE}"
          if [ "${CODE}" = "200" ]; then
            echo "🧪 تحقق من تجربة الموقع عبر الرابط: ${TARGET_PAGES_URL}"
            grep -E "<script|<title|جاري الاتصال" /tmp/pages_check.html | head -n 15 || true
          else
            echo "ℹ️ قد يكون GitHub Pages ما زال ينشر التحديث؛ جرّب فتح الرابط مباشرة: ${TARGET_PAGES_URL}"
          fi
          TARGET_RENDER_URL="${RENDER_URL:-[https://sudan-market-2.onrender.com](https://sudan-market-2.onrender.com)}"
          RCODE=$(curl -sL -m 15 -o /dev/null -w "%{http_code}" "${TARGET_RENDER_URL%/}/health" || echo "000")
          echo "🔌 فحص جسر Render (${TARGET_RENDER_URL%/}/health): HTTP ${RCODE}"
