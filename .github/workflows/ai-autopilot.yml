name: AI Auto Fix & Feature Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  monitor-and-evolve:
    if: "!contains(github.event.head_commit.message || '', '[ai-autopilot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect diagnostics, run multi-AI updater, and verify live site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PAGES_URL: "https://mb4252.github.io/sudan-market-/"
          RENDER_URL: "https://sudan-market-2.onrender.com"
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const vm = require("vm");

          const CANONICAL_PAGES_URL = "https://mb4252.github.io/sudan-market-/";
          const CANONICAL_RENDER_URL = "https://sudan-market-2.onrender.com";
          const STAGES_FILE = "public/stages.json";

          const ROADMAP_STAGES = [
            {
              id: "stage-sdm-smart-replies",
              title: "تطوير ردود SDM الذكية للأسئلة والمقارنة والحفظ لكل شخص في localStorage",
              files: ["public/sdm/sdm-smart-reply.js"],
              goal: "إنشاء ملف صغير واحد مستقل ومقفل يطوّر ردود SDM لتجيب بذكاء ووضوح عن أسئلة المستخدم والمقارنة والأسعار والمدن وتساعده، ويحفظ سجل دردشة كل شخص فوراً في localStorage مع تنسيق تاريخ آمن (بدون Invalid Date) دون تكرار نص الرسالة كقالب جامد. اربطه في index.html بـ defer وtry/catch."
            },
            {
              id: "stage-sdm-mobile-layout",
              title: "تحسين ترتيب حقول الدردشة والرسائل على شاشة الهاتف في ملف صغير مستقل",
              files: ["public/sdm/sdm-mobile-layout.js"],
              goal: "إنشاء ملف صغير واحد مستقل ومقفل يحسّن تنسيق وترتيب حقول الاسم والرسالة وزر الإرسال وصندوق الدردشة على شاشات الهاتف بوضوح دون تكدس أو شاشة بيضاء. اربطه في index.html بـ defer وtry/catch."
            },
            {
              id: "stage-sdm-per-person-switcher",
              title: "إدارة وتبديل دردشة كل شخص وحفظ محادثاته المستقلة في localStorage",
              files: ["public/sdm/sdm-person-sessions.js"],
              goal: "إنشاء ملف صغير واحد مستقل ومقفل يتيح التبديل بين هوية/شخص وآخر وعرض وحفظ محادثة كل شخص بشكل مستقل في localStorage فوراً. اربطه في index.html بـ defer وtry/catch."
            }
          ];

          function failWithReason(reason) {
            console.error("❌ AI STATUS: FAILED");
            console.error("سبب الفشل:", reason);
            process.exit(1);
          }

          function sanitizeUrl(rawUrl, fallbackUrl = "") {
            let u = String(rawUrl || "").trim();
            const mdMatch = u.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
            if (mdMatch) {
              u = (mdMatch[2] || mdMatch[1] || "").trim();
            }
            u = u.replace(/^<|>$/g, "").trim();
            return u || fallbackUrl;
          }

          function loadStagesState() {
            const defaultState = {
              completedStages: [],
              lockedFiles: [],
              currentStage: ROADMAP_STAGES[0].id,
              extraStageCounter: 0,
              wipedFromScratchDone: true
            };
            try {
              if (!fs.existsSync(STAGES_FILE)) return defaultState;
              const parsed = JSON.parse(fs.readFileSync(STAGES_FILE, "utf8"));
              return {
                completedStages: Array.isArray(parsed.completedStages) ? parsed.completedStages : [],
                lockedFiles: Array.isArray(parsed.lockedFiles) ? parsed.lockedFiles : [],
                currentStage: typeof parsed.currentStage === "string" ? parsed.currentStage : ROADMAP_STAGES[0].id,
                extraStageCounter: Number.isFinite(parsed.extraStageCounter) ? parsed.extraStageCounter : 0,
                wipedFromScratchDone: parsed.wipedFromScratchDone !== false
              };
            } catch {
              return defaultState;
            }
          }

          function isFileValidAndComplete(filePath) {
            const clean = String(filePath || "").replace(/^\/+/, "").trim();
            if (!clean || !fs.existsSync(clean)) return false;
            try {
              const raw = fs.readFileSync(clean, "utf8").trim();
              if (raw.length < 40) return false;
              if (clean.endsWith(".js")) {
                new vm.Script(raw, { filename: clean });
              } else if (clean.endsWith(".json")) {
                JSON.parse(raw);
              }
              return true;
            } catch {
              return false;
            }
          }

          function selectActiveStage(stagesState, lockedSet) {
            for (const st of ROADMAP_STAGES) {
              const primaryFiles = (st.files || []).filter(f => f !== "index.html");
              const allAlreadyDoneAndValid =
                stagesState.completedStages.includes(st.id) &&
                primaryFiles.length > 0 &&
                primaryFiles.every(f => lockedSet.has(f) && isFileValidAndComplete(f));

              if (allAlreadyDoneAndValid) {
                console.log(`⏭️ المرحلة [${st.id}] مكتملة وملفاتها موجودة ومقفلة وسليمة؛ لن يتم تعديلها.`);
                continue;
              }

              const anyPrimaryExistsAndValid = primaryFiles.length > 0 && primaryFiles.every(f => isFileValidAndComplete(f));
              if (anyPrimaryExistsAndValid) {
                console.log(`🔒 ملفات المرحلة [${st.id}] موجودة وسليمة في المستودع؛ سيتم قفلها دون تعديل والانتقال للتالية.`);
                for (const pf of primaryFiles) lockedSet.add(pf);
                if (!stagesState.completedStages.includes(st.id)) {
                  stagesState.completedStages.push(st.id);
                }
                continue;
              }

              return st;
            }

            const nextNum = (stagesState.extraStageCounter || 0) + 1;
            const dynamicId = `stage-sdm-small-module-${nextNum}`;
            return {
              id: dynamicId,
              title: `ملف صغير جديد ومقفل لـ SDM #${nextNum} بوظيفة واحدة`,
              files: [`public/sdm/sdm-module-${nextNum}.js`],
              goal: "إنشاء ملف صغير جداً (أقل من 140 سطر) بوظيفة واحدة واضحة ومرتبطة بـ SDM وlocalStorage والواجهة عبر index.html بـ defer وtry/catch، ثم قفله نهائياً وعدم تعديله مرة أخرى."
            };
          }

          function collectProjectFiles(dir = ".", depth = 0, out = []) {
            if (depth > 3) return out;
            const ignore = new Set(["node_modules", ".git", ".github"]);
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignore.has(entry.name)) continue;
              const fullPath = path.join(dir, entry.name).replace(/\\/g, "/");
              if (entry.isDirectory()) {
                collectProjectFiles(fullPath, depth + 1, out);
              } else if (/\.(js|html|css|json|py|ts)$/i.test(entry.name)) {
                const content = fs.readFileSync(fullPath, "utf8");
                const clipped = content.length > 1400
                  ? content.slice(0, 1400) + "\n/* ...مقتطع للاختصار... */"
                  : content;
                out.push({ fullPath, raw: content, content: clipped });
              }
            }
            return out;
          }

          function isValidCleanFilePath(cleanPath) {
            if (!cleanPath || cleanPath.includes("..") || /\s/.test(cleanPath)) return false;
            if (/^file_\d+_/i.test(cleanPath)) return false;
            return /^(index\.html|app\.js|api\.js|styles\.css|server\.js|public\/[a-zA-Z0-9._/-]+\.(js|css|html|json)|services\/[a-zA-Z0-9._/-]+\.(py|ts|js)|tools\/[a-zA-Z0-9._/-]+\.(ts|py|js))$/.test(cleanPath);
          }

          function validateGeneratedFiles(filesMap, lockedFilesSet) {
            const errors = [];
            if (!filesMap || typeof filesMap !== "object") {
              return ["كائن files مفقود أو غير صالح."];
            }

            const htmlContent = typeof filesMap["index.html"] === "string"
              ? filesMap["index.html"]
              : (fs.existsSync("index.html") ? fs.readFileSync("index.html", "utf8") : "");

            const writtenJsFiles = Object.keys(filesMap)
              .map(p => String(p).replace(/^\/+/, "").trim())
              .filter(p => p.endsWith(".js"));

            if (writtenJsFiles.length > 0 && htmlContent) {
              const missingInHtml = writtenJsFiles.filter(f => !htmlContent.includes(f) && !htmlContent.includes(f.replace(/^public\//, "")));
              if (missingInHtml.length > 0) {
                errors.push(`الملفات التالية يجب تحميلها في index.html لتعمل فوراً في الواجهة: ${missingInHtml.join(", ")}`);
              }
            }

            for (const [rawPath, content] of Object.entries(filesMap)) {
              const cleanPath = String(rawPath).replace(/^\/+/, "").trim();
              if (!isValidCleanFilePath(cleanPath) || typeof content !== "string" || !content.trim()) {
                errors.push(`مسار أو محتوى غير صالح للملف: ${rawPath}`);
                continue;
              }
              if (lockedFilesSet && lockedFilesSet.has(cleanPath)) {
                errors.push(`الملف ${cleanPath} مقفل وممنوع إعادة تعديله مرة أخرى.`);
                continue;
              }
              if (cleanPath.endsWith(".json")) {
                try {
                  JSON.parse(content);
                } catch (e) {
                  errors.push(`خطأ JSON في ${cleanPath}: ${e.message}`);
                }
              } else if (cleanPath.endsWith(".js")) {
                try {
                  new vm.Script(content, { filename: cleanPath });
                } catch (e) {
                  errors.push(`خطأ صياغة JavaScript في ${cleanPath}: ${e.message}`);
                }
              }
            }

            return errors;
          }

          async function probeLiveEndpoints(pagesUrl, renderUrl) {
            const lines = [];
            const cleanPages = sanitizeUrl(pagesUrl, CANONICAL_PAGES_URL);
            const cleanRender = sanitizeUrl(renderUrl, CANONICAL_RENDER_URL).replace(/\/+$/, "");

            try {
              const res = await fetch(cleanPages, { signal: AbortSignal.timeout(12000) });
              const html = await res.text();
              const scriptSrcs = [...html.matchAll(/<script[^>]+src=["'\'']([^"'\'']+)["'\'']/gi)].map(m => m[1]);
              lines.push(`صفحة GitHub Pages (${cleanPages}): HTTP ${res.status} | عدد السكربتات: ${scriptSrcs.length} (${scriptSrcs.join(", ") || "لا يوجد"})`);
            } catch (e) {
              lines.push(`تعذر فحص صفحة GitHub Pages (${cleanPages}): ${e.message}`);
            }

            try {
              const hRes = await fetch(`${cleanRender}/health`, { signal: AbortSignal.timeout(15000) });
              const hTxt = await hRes.text();
              lines.push(`جسر Render (${cleanRender}/health): HTTP ${hRes.status} | الرد: ${hTxt.slice(0, 120)}`);
            } catch (e) {
              lines.push(`جسر Render (${cleanRender}/health): غير مستجيب حالياً (${e.message}) — يجب أن يعمل الحفظ والرد الفوري محلياً دون انتظار Render.`);
            }

            return lines.join("\n");
          }

          function runSelfDiagnostics(filesList, renderUrl) {
            const issues = [];
            const htmlFile = filesList.find(f => f.fullPath === "index.html");
            const jsFiles = filesList.filter(f => f.fullPath.endsWith(".js") && f.fullPath !== "server.js");

            if (!htmlFile || !/<body[\s\S]*<\/body>/i.test(htmlFile.raw) || htmlFile.raw.replace(/<[^>]+>/g, "").trim().length < 25) {
              issues.push("واجهة index.html تفتقر إلى عناصر مرئية واضحة في الصفحة (خطر ظهور شاشة بيضاء).");
            }

            const allJsRaw = jsFiles.map(f => f.raw).join("\n");
            const combinedRaw = allJsRaw + "\n" + (htmlFile ? htmlFile.raw : "");

            if (/window\.isValidDate|\bisValidDate\b/.test(combinedRaw) && !/window\.isValidDate\s*=|function\s+isValidDate\b/.test(combinedRaw)) {
              issues.push("استدعاء isValidDate أو window.isValidDate دون تعريفها على window.");
            }
            if (/getElementById\([^)]+\)\.textContent\s*=|querySelector\([^)]+\)\.textContent\s*=/.test(combinedRaw)) {
              issues.push("إسناد مباشر لـ .textContent دون التحقق من وجود العنصر.");
            }
            if (/YOUR-SERVICE|example\.onrender\.com/i.test(combinedRaw)) {
              issues.push(`رابط Render وهمي موجود في الكود؛ استخدم ${renderUrl}`);
            }

            return {
              text: issues.length
                ? issues.map((x, i) => `${i + 1}. ${x}`).join("\n")
                : "لا توجد أخطاء حرجة في الفحص الساكن.",
              hasCritical: issues.length > 0
            };
          }

          async function getGroqModelsOrdered(apiKey) {
            const fallbackModels = [
              "openai/gpt-oss-120b",
              "openai/gpt-oss-20b",
              "qwen/qwen3.8-27b",
              "llama-3.3-70b-versatile",
              "llama-3.1-8b-instant"
            ];
            try {
              const res = await fetch(sanitizeUrl("https://api.groq.com/openai/v1/models"), {
                headers: { Authorization: `Bearer ${apiKey}` }
              });
              if (!res.ok) return fallbackModels;
              const data = await res.json();
              const ids = (data.data || [])
                .map(m => m.id)
                .filter(id => id && !/whisper|tts|guard|prompt-guard|safeguard|embed|allam|orpheus/i.test(id));
              const ordered = [];
              for (const p of fallbackModels) {
                if (ids.includes(p) && !ordered.includes(p)) ordered.push(p);
              }
              for (const id of ids) {
                if (!ordered.includes(id)) ordered.push(id);
              }
              return ordered.length ? ordered : fallbackModels;
            } catch {
              return fallbackModels;
            }
          }

          function sanitizeControlCharsInsideStrings(raw) {
            let out = "";
            let inStr = false;
            let esc = false;
            for (let i = 0; i < raw.length; i++) {
              const ch = raw[i];
              if (esc) { out += ch; esc = false; continue; }
              if (ch === "\\") { out += ch; esc = true; continue; }
              if (ch === "\"") { out += ch; inStr = !inStr; continue; }
              if (inStr) {
                if (ch === "\n") { out += "\\n"; continue; }
                if (ch === "\r") { out += "\\r"; continue; }
                if (ch === "\t") { out += "\\t"; continue; }
              }
              out += ch;
            }
            return out;
          }

          function tryRepairJson(candidate) {
            let s = sanitizeControlCharsInsideStrings(String(candidate || "").trim());
            const firstBrace = s.indexOf("{");
            if (firstBrace > 0) s = s.slice(firstBrace);
            const lastBrace = s.lastIndexOf("}");
            if (lastBrace !== -1) s = s.slice(0, lastBrace + 1);

            let inString = false;
            let escaped = false;
            let openBraces = 0;

            for (let i = 0; i < s.length; i++) {
              const ch = s[i];
              if (escaped) { escaped = false; continue; }
              if (ch === "\\") { escaped = true; continue; }
              if (ch === "\"") { inString = !inString; continue; }
              if (!inString) {
                if (ch === "{") openBraces++;
                else if (ch === "}") openBraces = Math.max(0, openBraces - 1);
              }
            }

            if (escaped) s = s.slice(0, -1);
            if (inString) s += "\"";
            while (openBraces > 0) { s += "}"; openBraces--; }

            return JSON.parse(s);
          }

          function extractJsonObject(text) {
            const cleaned = sanitizeControlCharsInsideStrings(
              String(text || "")
                .replace(/^```json\s*/i, "")
                .replace(/^```\s*/i, "")
                .replace(/```\s*$/i, "")
                .trim()
            );
            try {
              return JSON.parse(cleaned);
            } catch {
              const start = cleaned.indexOf("{");
              const end = cleaned.lastIndexOf("}");
              if (start !== -1 && end !== -1 && end > start) {
                try {
                  return JSON.parse(cleaned.slice(start, end + 1));
                } catch {
                  return tryRepairJson(cleaned);
                }
              }
              return tryRepairJson(cleaned);
            }
          }

          async function callChatCompletion(targetUrl, targetHeaders, payloadBody) {
            const res = await fetch(sanitizeUrl(targetUrl), {
              method: "POST",
              headers: targetHeaders,
              body: JSON.stringify(payloadBody)
            });
            const txt = await res.text();
            let jsonData;
            try {
              jsonData = JSON.parse(txt);
            } catch {
              const err = new Error(`الرد ليس JSON صالحاً (HTTP ${res.status}): ${txt.slice(0, 350)}`);
              err.status = res.status;
              throw err;
            }
            if (!res.ok || jsonData.error) {
              const msg = jsonData?.error?.message || JSON.stringify(jsonData?.error || txt).slice(0, 350);
              const err = new Error(`HTTP ${res.status}: ${msg}`);
              err.status = res.status;
              throw err;
            }
            return jsonData;
          }

          async function callOpenRouterWithRetry(key, sysPrompt, usrPrompt, maxTokens) {
            const data = await callChatCompletion(
              "[https://openrouter.ai/api/v1/chat/completions](https://openrouter.ai/api/v1/chat/completions)",
              {
                "Content-Type": "application/json",
                Authorization: `Bearer ${key}`,
                "HTTP-Referer": CANONICAL_PAGES_URL,
                "X-Title": "sudan-market-autopilot"
              },
              {
                model: "openrouter/free",
                messages: [
                  { role: "system", content: sysPrompt },
                  { role: "user", content: usrPrompt }
                ],
                max_tokens: maxTokens,
                temperature: 0.4
              }
            );
            const out = data?.choices?.[0]?.message?.content || "";
            if (!out.trim()) throw new Error("رد فارغ من OpenRouter");
            return out;
          }

          async function callMistral(key, sysPrompt, usrPrompt, maxTokens, jsonMode = false) {
            const models = ["codestral-latest", "mistral-small-latest", "open-mistral-nemo"];
            let lastErr = null;
            for (const m of models) {
              try {
                const body = {
                  model: m,
                  messages: [
                    { role: "system", content: sysPrompt },
                    { role: "user", content: usrPrompt }
                  ],
                  max_tokens: maxTokens,
                  temperature: 0.4
                };
                if (jsonMode && m !== "codestral-latest") {
                  body.response_format = { type: "json_object" };
                }
                const data = await callChatCompletion(
                  "[https://api.mistral.ai/v1/chat/completions](https://api.mistral.ai/v1/chat/completions)",
                  { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
                  body
                );
                const out = data?.choices?.[0]?.message?.content || "";
                if (!out.trim()) throw new Error(`رد فارغ من Mistral (${m})`);
                return { text: out, detail: `Mistral (${m})` };
              } catch (e) {
                lastErr = e;
                console.warn(`⚠️ نموذج Mistral (${m}) تعذر: ${e.message}`);
              }
            }
            throw lastErr || new Error("فشل جميع نماذج Mistral");
          }

          function buildProviders(primaryKey, openRouterKey, mistralKey) {
            const list = [];
            const seen = new Set();

            if (openRouterKey) {
              seen.add(openRouterKey);
              list.push({
                id: "openrouter",
                label: "OpenRouter (ChatGPT-style strong model)",
                runText: async (sysPrompt, usrPrompt, maxTokens = 550) => {
                  const out = await callOpenRouterWithRetry(openRouterKey, sysPrompt, usrPrompt, maxTokens);
                  return { text: out, detail: "OpenRouter (openrouter/free)" };
                },
                runJson: async (sysPrompt, usrPrompt, maxTokens = 6500) => {
                  const raw = await callOpenRouterWithRetry(openRouterKey, sysPrompt, usrPrompt, maxTokens);
                  return { parsed: extractJsonObject(raw), detail: "OpenRouter (openrouter/free)" };
                }
              });
            }

            if (mistralKey) {
              seen.add(mistralKey);
              list.push({
                id: "mistral",
                label: "Mistral AI",
                runText: async (sysPrompt, usrPrompt, maxTokens = 550) =>
                  await callMistral(mistralKey, sysPrompt, usrPrompt, maxTokens, false),
                runJson: async (sysPrompt, usrPrompt, maxTokens = 6500) => {
                  const res = await callMistral(mistralKey, sysPrompt, usrPrompt, maxTokens, true);
                  return { parsed: extractJsonObject(res.text), detail: res.detail };
                }
              });
            }

            const otherKeys = [primaryKey].map(k => (k || "").trim()).filter(Boolean);
            for (const key of otherKeys) {
              if (seen.has(key)) continue;
              seen.add(key);

              if (key.startsWith("gsk_")) {
                list.push({
                  id: "groq",
                  label: "Groq",
                  runText: async (sysPrompt, usrPrompt, maxTokens = 550) => {
                    const models = await getGroqModelsOrdered(key);
                    let lastErr = null;
                    for (const m of models) {
                      try {
                        const data = await callChatCompletion(
                          "[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)",
                          { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
                          {
                            model: m,
                            messages: [
                              { role: "system", content: sysPrompt },
                              { role: "user", content: usrPrompt }
                            ],
                            max_tokens: maxTokens,
                            temperature: 0.4
                          }
                        );
                        const out = data?.choices?.[0]?.message?.content || "";
                        if (!out.trim()) throw new Error("رد فارغ");
                        return { text: out, detail: `Groq (${m})` };
                      } catch (e) {
                        lastErr = e;
                        console.warn(`⚠️ نموذج Groq (${m}) تعذر: ${e.message}`);
                      }
                    }
                    throw lastErr || new Error("فشل نماذج Groq");
                  },
                  runJson: async (sysPrompt, usrPrompt, maxTokens = 4500) => {
                    const models = await getGroqModelsOrdered(key);
                    let lastErr = null;
                    for (const m of models) {
                      try {
                        let data;
                        try {
                          data = await callChatCompletion(
                            "[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)",
                            { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
                            {
                              model: m,
                              messages: [
                                { role: "system", content: sysPrompt },
                                { role: "user", content: usrPrompt }
                              ],
                              response_format: { type: "json_object" },
                              max_tokens: maxTokens,
                              temperature: 0.4
                            }
                          );
                        } catch (jErr) {
                          if (jErr.status === 429 || jErr.status === 400) throw jErr;
                          data = await callChatCompletion(
                            "[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)",
                            { "Content-Type": "application/json", Authorization: `Bearer ${key}` },
                            {
                              model: m,
                              messages: [
                                { role: "system", content: sysPrompt },
                                { role: "user", content: usrPrompt }
                              ],
                              max_tokens: maxTokens,
                              temperature: 0.4
                            }
                          );
                        }
                        const raw = data?.choices?.[0]?.message?.content || "";
                        if (!raw.trim()) throw new Error("رد فارغ");
                        return { parsed: extractJsonObject(raw), detail: `Groq (${m})` };
                      } catch (e) {
                        lastErr = e;
                        console.warn(`⚠️ نموذج Groq (${m}) تعذر في JSON: ${e.message}`);
                      }
                    }
                    throw lastErr || new Error("فشل توليد JSON من Groq");
                  }
                });
              }
            }
            return list;
          }

          function normalizeSummaryText(summaryVal, fallbackTitle) {
            if (typeof summaryVal === "string" && summaryVal.trim()) {
              return summaryVal.trim();
            }
            if (summaryVal && typeof summaryVal === "object") {
              if (typeof summaryVal.description === "string" && summaryVal.description.trim()) {
                return summaryVal.description.trim();
              }
              try {
                return JSON.stringify(summaryVal);
              } catch {
                return fallbackTitle;
              }
            }
            return fallbackTitle;
          }

          async function run() {
            const primaryKey = (process.env.AI_API_KEY || "").trim();
            const openRouterKey = (process.env.OPENROUTER_API_KEY || "").trim();
            const mistralKey = (process.env.MISTRAL_API_KEY || "").trim();
            const pagesUrl = sanitizeUrl(process.env.PAGES_URL, CANONICAL_PAGES_URL);
            const renderUrl = sanitizeUrl(process.env.RENDER_URL, CANONICAL_RENDER_URL);
            const providers = buildProviders(primaryKey, openRouterKey, mistralKey);

            if (!providers.length) {
              failWithReason("لا يوجد أي مفتاح API صالح في Secrets.");
            }

            const stagesState = loadStagesState();
            const lockedSet = new Set(stagesState.lockedFiles);
            const activeStage = selectActiveStage(stagesState, lockedSet);

            // فحص المستودع أولاً: إذا كانت ملفات المرحلة موجودة ومرتبة وسليمة لا نعدّلها
            const stageNewFiles = (activeStage.files || []).filter(f => f !== "index.html");
            if (stageNewFiles.length > 0 && stageNewFiles.every(f => isFileValidAndComplete(f))) {
              console.log(`✅ ملفات المرحلة [${activeStage.id}] موجودة وسليمة بالفعل في المستودع؛ سيتم قفلها دون تعديل.`);
              for (const f of stageNewFiles) lockedSet.add(f);
              const nextCompleted = Array.from(new Set([...stagesState.completedStages, activeStage.id]));
              const nextLocked = Array.from(lockedSet);
              const nextStages = {
                ...stagesState,
                completedStages: nextCompleted,
                lockedFiles: nextLocked,
                currentStage: nextCompleted.length >= ROADMAP_STAGES.length
                  ? `stage-sdm-small-module-${(stagesState.extraStageCounter || 0) + 1}`
                  : ROADMAP_STAGES.find(s => !nextCompleted.includes(s.id))?.id || activeStage.id
              };
              fs.mkdirSync("public", { recursive: true });
              fs.writeFileSync(STAGES_FILE, JSON.stringify(nextStages, null, 2), "utf8");
              process.exit(0);
            }

            const filesList = collectProjectFiles(".");
            const diag = runSelfDiagnostics(filesList, renderUrl);
            const liveReport = await probeLiveEndpoints(pagesUrl, renderUrl);

            console.log(`🎯 المرحلة الحصرية الحالية: [${activeStage.id}] — ${activeStage.title}`);
            console.log(`✅ المراحل المكتملة: ${stagesState.completedStages.join(", ") || "لا يوجد"}`);
            console.log(`🔒 الملفات المقفلة نهائياً (لا تُعدل مرة أخرى): ${stagesState.lockedFiles.join(", ") || "لا يوجد"}`);
            console.log("🩺 تقرير التشخيص:\n" + diag.text + "\n\n--- فحص الموقع الحي والجسر ---\n" + liveReport);

            const currentFiles = filesList
              .map(f => `--- FILE: ${f.fullPath} ---\n${f.content}`)
              .join("\n\n")
              .slice(0, 4200);

            const lockedListForPrompt = stagesState.lockedFiles.join(", ") || "لا يوجد";
            const stageMandate = [
              `رابط GitHub Pages الصحيح: ${pagesUrl}`,
              `رابط جسر Render الصحيح: ${renderUrl} (للبث المباشر عبر wss://sudan-market-2.onrender.com وطلب الإيقاظ /health).`,
              `المرحلة الحصرية المطلوبة الآن: ${activeStage.id} (${activeStage.title})`,
              `هدف هذه المرحلة فقط: ${activeStage.goal}`,
              `الملف/الملفات المطلوبة لهذه المرحلة: ${activeStage.files.join(" ، ")} (اجعل كل ملف صغيراً جداً ومكتملاً دون قطع أو اختصار).`,
              "انظر أولاً إلى الملفات الموجودة في المستودع: إذا كان ملف المرحلة موجوداً بالفعل وسليماً ومرتباً فلا تعدله، واكتفِ بربطه في index.html عند الحاجة.",
              "احرص على تضمين أي ملف JS جديد في index.html مع defer، وتغليف التنفيذ داخل try { ... } catch (e) {}، والتحقق من وجود عناصر DOM قبل إسناد .textContent، وتجنّب Invalid Date.",
              `قفل صارم — الملفات التالية مقفلة وممنوع تعديلها أو إعادة كتابتها مرة أخرى: [${lockedListForPrompt}].`
            ].join("\n");

            let agreedPlan = "";
            let activeExecutor = providers[0];

            if (providers.length >= 2) {
              const p1 = providers[0];
              const p2 = providers[1];
              console.log(`🤝 حوار التشخيص والابتكار نشط بين: [${p1.label}] و [${p2.label}]`);
              try {
                const propRes = await p1.runText(
                  "أنت مهندس برمجيات خبير مثل ChatGPT. افحص المستودع أولاً وضع خطة لملف صغير واحد مكتمل بوظيفة واحدة واضحة دون قطع، مع احترام الملفات المقفلة والموجودة مسبقاً.",
                  `${stageMandate}\n\nالتشخيص:\n${diag.text}\n\nالملفات الحالية:\n${currentFiles}`,
                  450
                );
                console.log(`💡 مقترح ${propRes.detail} جاهز للمراجعة.`);
                try {
                  const revRes = await p2.runText(
                    "أنت المدقق الهندسي. راجع الخطة وتأكد أن الملف صغير ومكتمل بلا قطع ويعمل فوراً في الواجهة وأن الملفات المقفلة أو السليمة لا تُعدل، ثم اكتب [اتفقنا] متبوعاً بالخطة.",
                    `مقترح الطرف الأول:\n${propRes.text}\n\n${stageMandate}`,
                    450
                  );
                  agreedPlan = revRes.text;
                  activeExecutor = p2;
                  console.log(`✅ تم الاتفاق بين الطرفين عبر ${revRes.detail}.`);
                } catch (revErr) {
                  console.warn(`⚠️ تعذرت مراجعة الطرف الثاني (${revErr.message}) — يكمل الطرف الأول التنفيذ مباشرة.`);
                  agreedPlan = `[اتفاق مباشر]\n${propRes.text}`;
                  activeExecutor = p1;
                }
              } catch (propErr) {
                console.warn(`⚠️ تعذر الطرف الأول (${propErr.message}) — ينتقل الطرف الثاني للعمل المستقل الفوري.`);
                const soloRes = await p2.runText(
                  "أنت المنفذ المستقل. ضع خطة لملف صغير واحد مكتمل بلا قطع ويعمل فوراً في الواجهة.",
                  `${stageMandate}\n\n${currentFiles}`,
                  450
                );
                agreedPlan = `[عمل مستقل فوري]\n${soloRes.text}`;
                activeExecutor = p2;
              }
            } else {
              agreedPlan = `نفّذ المرحلة الحصرية التالية فقط:\n${stageMandate}`;
            }

            const systemJsonInstruction = [
              "أنت مهندس برمجيات خبير مثل ChatGPT. أعد كائن JSON صالحاً فقط بدون أي نص خارجه.",
              "اكتب كوداً كاملاً غير مقطوع لملف صغير بوظيفة واحدة واضحة يعمل فوراً في الواجهة، ولا تعدّل أي ملف مقفل أو موجود وسليم.",
              "الشكل المطلوب: {\"files\":{\"مسار_ملف\":\"محتواه\"},\"summary\":\"ملخص نصي واضح\"}"
            ].join("\n");

            const executionPrompt = [
              "نفّذ هذه المرحلة الحصرية عبر ملف صغير كامل غير مقطوع:",
              agreedPlan,
              "",
              stageMandate,
              "",
              "=== CURRENT FILES ===",
              currentFiles
            ].join("\n");

            let execResult = null;
            const orderedExecutors = [activeExecutor, ...providers.filter(pr => pr !== activeExecutor)].filter(Boolean);
            let lastExecErr = null;

            for (const execProvider of orderedExecutors) {
              try {
                execResult = await execProvider.runJson(systemJsonInstruction, executionPrompt, 6500);
                const errs = validateGeneratedFiles(execResult?.parsed?.files, lockedSet);
                if (errs.length) {
                  console.warn(`⚠️ ملاحظات تحقق في مخرجات ${execProvider.label}: ${errs.join(" | ")}`);
                }
                lastExecErr = null;
                break;
              } catch (e) {
                lastExecErr = e;
                console.warn(`⚠️ تعذر التنفيذ عبر ${execProvider.label} (${e.message}) — انتقال فوري للمزود التالي.`);
              }
            }

            if (!execResult || !execResult.parsed) {
              console.warn(`⚠️ AI STATUS: RATE_LIMITED_OR_UNAVAILABLE (${lastExecErr ? lastExecErr.message : "خطأ غير معروف"})`);
              console.log("ℹ️ تم تجاوز هذه الجولة مؤقتاً بسبب حدود المزودين أو انقطاع الرد دون إيقاف المستودع.");
              process.exit(0);
            }

            const parsed = execResult.parsed;
            const summaryText = normalizeSummaryText(parsed.summary, activeStage.title);
            console.log(`✅ AI STATUS: WORKING (${execResult.detail})`);
            console.log("ملخص التحديث:", summaryText);

            let updatedCount = 0;
            const newlyLockedFiles = [];

            if (parsed.files && typeof parsed.files === "object") {
              for (const [filePath, content] of Object.entries(parsed.files)) {
                const cleanPath = String(filePath).replace(/^\/+/, "").trim();
                if (!isValidCleanFilePath(cleanPath) || typeof content !== "string" || !content.trim()) continue;
                if (lockedSet.has(cleanPath)) {
                  console.log(`🔒 الملف مقفل ولن يُعدل مرة أخرى: ${cleanPath}`);
                  continue;
                }
                if (cleanPath !== "index.html" && isFileValidAndComplete(cleanPath)) {
                  console.log(`✅ الملف موجود وسليم بالفعل في المستودع ولن يُعاد كتابته: ${cleanPath}`);
                  newlyLockedFiles.push(cleanPath);
                  continue;
                }
                if (cleanPath.endsWith(".json")) {
                  try { JSON.parse(content); } catch { continue; }
                } else if (cleanPath.endsWith(".js")) {
                  try { new vm.Script(content, { filename: cleanPath }); } catch { continue; }
                }
                const dirName = path.dirname(cleanPath);
                if (dirName && dirName !== ".") fs.mkdirSync(dirName, { recursive: true });
                const prevContent = fs.existsSync(cleanPath) ? fs.readFileSync(cleanPath, "utf8") : "";
                if (prevContent !== content) {
                  fs.writeFileSync(cleanPath, content, "utf8");
                  updatedCount++;
                  if (cleanPath !== "index.html") {
                    newlyLockedFiles.push(cleanPath);
                  }
                  console.log(`📝 تم إنشاء/تحديث الملف: ${cleanPath}`);
                }
              }
            }

            if (updatedCount > 0 || newlyLockedFiles.length > 0) {
              const isBaseStage = ROADMAP_STAGES.some(s => s.id === activeStage.id);
              const nextCompleted = Array.from(new Set([...stagesState.completedStages, activeStage.id]));
              const nextLocked = Array.from(new Set([...stagesState.lockedFiles, ...newlyLockedFiles]));
              const nextStageObj = selectActiveStage(
                {
                  completedStages: nextCompleted,
                  lockedFiles: nextLocked,
                  extraStageCounter: (!isBaseStage && updatedCount > 0)
                    ? (stagesState.extraStageCounter || 0) + 1
                    : stagesState.extraStageCounter
                },
                new Set(nextLocked)
              );
              const updatedStagesState = {
                completedStages: nextCompleted,
                lockedFiles: nextLocked,
                currentStage: nextStageObj.id,
                extraStageCounter: (!isBaseStage && updatedCount > 0)
                  ? (stagesState.extraStageCounter || 0) + 1
                  : stagesState.extraStageCounter,
                wipedFromScratchDone: true
              };
              fs.mkdirSync("public", { recursive: true });
              fs.writeFileSync(STAGES_FILE, JSON.stringify(updatedStagesState, null, 2), "utf8");
              if (newlyLockedFiles.length > 0) {
                console.log(`🔒 تم قفل الملفات المكتملة (لن تُعدل مرة أخرى): ${newlyLockedFiles.join(", ")}`);
              }
              console.log(`🏁 تم إنهاء المرحلة [${activeStage.id}] والانتقال إلى [${nextStageObj.id}]`);
              if (updatedCount > 0) {
                fs.writeFileSync(
                  "last_ai_change.txt",
                  summaryText.replace(/[\r\n]+/g, " ").slice(0, 120),
                  "utf8"
                );
              }
            }

            console.log(`عدد الملفات التي تغيّر محتواها: ${updatedCount}`);
          }

          run();
          '

      - name: Commit, push, and verify live site
        env:
          REPO: ${{ github.repository }}
          PAGES_URL: "[https://mb4252.github.io/sudan-market-/](https://mb4252.github.io/sudan-market-/)"
          RENDER_URL: "[https://sudan-market-2.onrender.com](https://sudan-market-2.onrender.com)"
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "ai-autopilot[bot]"
          git config user.email "ai-autopilot[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            rm -f last_ai_change.txt
            echo "ℹ️ nothing to commit, working tree clean."
            exit 0
          fi
          SUMMARY="SDM smart replies in small locked module"
          if [ -f last_ai_change.txt ]; then
            SUMMARY=$(head -n 1 last_ai_change.txt)
            rm -f last_ai_change.txt
            git add -A
          fi
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "[ai-autopilot] ${SUMMARY}"
          git push origin HEAD
          echo "✅ PUSH STATUS: تم رفع التعديلات إلى GitHub بنجاح."
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            curl -s -X POST "${RENDER_DEPLOY_HOOK_URL}" || true
          fi

          TARGET_PAGES_URL="[https://mb4252.github.io/sudan-market-/](https://mb4252.github.io/sudan-market-/)"
          echo "⏳ انتظار نشر التحديث على GitHub Pages للفحص..."
          sleep 40
          CODE="000"
          for i in 1 2; do
            CODE=$(curl -sL --connect-timeout 10 -m 20 -o /tmp/pages_check.html -w "%{http_code}" "${TARGET_PAGES_URL}" || echo "000")
            [ "${CODE}" = "200" ] && break
            sleep 15
          done
          echo "🌐 فحص ما بعد النشر (${TARGET_PAGES_URL}): HTTP ${CODE}"
          if [ "${CODE}" = "200" ]; then
            echo "🧪 تحقق من تجربة الموقع عبر الرابط: ${TARGET_PAGES_URL}"
            grep -E "<script|<title|جاري الاتصال" /tmp/pages_check.html | head -n 15 || true
          else
            echo "ℹ️ لم يكتمل رد GitHub Pages بعد (HTTP ${CODE})؛ جرّب فتح الرابط مباشرة: ${TARGET_PAGES_URL}"
          fi

          TARGET_RENDER_URL="[https://sudan-market-2.onrender.com](https://sudan-market-2.onrender.com)"
          RCODE=$(curl -sL --connect-timeout 12 -m 25 -o /dev/null -w "%{http_code}" "${TARGET_RENDER_URL}/health" || echo "000")
          echo "🔌 فحص جسر Render (${TARGET_RENDER_URL}/health): HTTP ${RCODE}"
