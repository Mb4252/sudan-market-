name: AI Auto Fix & Feature Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: ai-autopilot
  cancel-in-progress: false

jobs:
  monitor-and-evolve:
    if: "!contains(github.event.head_commit.message || '', '[ai-autopilot]')"
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: "🧠 Multi-Agent Autopilot"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PAGES_URL: "https://mb4252.github.io/sudan-market-/"
          RENDER_URL: "https://sudan-market-2.onrender.com"
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: node .github/scripts/autopilot.js

      - name: "🚀 Commit + Push + Render Hook"
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          git config user.name "ai-autopilot[bot]"
          git config user.email "ai-autopilot[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            rm -f last_ai_change.txt
            echo "ℹ️ لا تغييرات."
            exit 0
          fi
          SUMMARY="Autopilot cycle"
          if [ -f last_ai_change.txt ]; then
            SUMMARY=$(head -n 1 last_ai_change.txt)
            rm -f last_ai_change.txt
            git add -A
          fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "[ai-autopilot] ${SUMMARY}"
          git push origin HEAD
          echo "✅ PUSH OK"
          if [ -n "${RENDER_DEPLOY_HOOK_URL}" ]; then
            curl -s -X POST "${RENDER_DEPLOY_HOOK_URL}" || true
          fi

      - name: "🌐 Live Verification"
        env:
          PAGES_URL: "https://mb4252.github.io/sudan-market-/"
          RENDER_URL: "https://sudan-market-2.onrender.com"
        run: |
          echo "⏳ انتظار GitHub Pages (45s)..."
          sleep 45
          CODE="000"
          for i in 1 2 3; do
            CODE=$(curl -sL --connect-timeout 10 -m 20 -o /tmp/p.html -w "%{http_code}" "${PAGES_URL}" || echo "000")
            [ "$CODE" = "200" ] && break
            sleep 15
          done
          echo "🌐 Pages: HTTP ${CODE}"
          [ "$CODE" = "200" ] && grep -E "<script|<title" /tmp/p.html | head -n 10 || true
          RCODE=$(curl -sL --connect-timeout 12 -m 25 -o /dev/null -w "%{http_code}" "${RENDER_URL}/health" || echo "000")
          echo "🔌 Render /health: HTTP ${RCODE}"
