name: AI Auto Fix & Feature Updater

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_run:
    workflows: ["*"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

jobs:
  monitor-and-evolve:
    if: "!contains(github.event.head_commit.message || '', '[ai-autopilot]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Collect GitHub Actions logs and run AI updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function failWithReason(reason) {
            console.error("❌ AI STATUS: FAILED");
            console.error("سبب الفشل:", reason);
            process.exit(1);
          }

          function sanitizeUrl(rawUrl) {
            let u = String(rawUrl || "").trim();
            const mdMatch = u.match(/^\[([^\]]+)\]\(([^)]+)\)$/);
            if (mdMatch) {
              u = (mdMatch[2] || mdMatch[1] || "").trim();
            }
            return u.replace(/^<|>$/g, "").trim();
          }

          function collectProjectFiles(dir = ".", depth = 0, out = []) {
            if (depth > 2) return out;
            const ignore = new Set(["node_modules", ".git", ".github"]);
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (ignore.has(entry.name)) continue;
              const fullPath = path.join(dir, entry.name).replace(/\\/g, "/");
              if (entry.isDirectory()) {
                collectProjectFiles(fullPath, depth + 1, out);
              } else if (/\.(js|html|css|json)$/i.test(entry.name)) {
                const content = fs.readFileSync(fullPath, "utf8");
                const clipped = content.length > 1800
                  ? content.slice(0, 1800) + "\n/* ...مقتطع لتوفير السياق والتوكنات... */"
                  : content;
                out.push({ fullPath, content: clipped });
              }
            }
            return out;
          }

          async function getGroqModelsOrdered(apiKey) {
            const modelsUrl = sanitizeUrl("https://api.groq.com/openai/v1/models");
            const res = await fetch(modelsUrl, {
              headers: { Authorization: `Bearer ${apiKey}` }
            });
            if (!res.ok) {
              const txt = await res.text();
              const err = new Error(`تعذر جلب نماذج Groq (HTTP ${res.status}): ${txt.slice(0, 250)}`);
              err.status = res.status;
              throw err;
            }
            const data = await res.json();
            const ids = (data.data || [])
              .map(m => m.id)
              .filter(id => !/whisper|tts|guard|prompt-guard|safeguard|embed|allam/i.test(id));

            if (!ids.length) {
              throw new Error("لا توجد نماذج نصية مناسبة في حساب Groq الحالي.");
            }

            const preferred = [
              "llama-3.3-70b-versatile",
              "openai/gpt-oss-120b",
              "qwen/qwen3-32b",
              "llama-3.1-8b-instant",
              "openai/gpt-oss-20b"
            ];

            const ordered = [];
            for (const p of preferred) {
              if (ids.includes(p) && !ordered.includes(p)) ordered.push(p);
            }
            for (const id of ids) {
              if (!ordered.includes(id)) ordered.push(id);
            }
            return ordered;
          }

          function tryRepairJson(candidate) {
            let s = String(candidate || "").trim();
            const firstBrace = s.indexOf("{");
            if (firstBrace > 0) {
              s = s.slice(firstBrace);
            }
            const lastBrace = s.lastIndexOf("}");
            if (lastBrace !== -1) {
              s = s.slice(0, lastBrace + 1);
            }

            let inString = false;
            let escaped = false;
            let openBraces = 0;

            for (let i = 0; i < s.length; i++) {
              const ch = s[i];
              if (escaped) {
                escaped = false;
                continue;
              }
              if (ch === "\\") {
                escaped = true;
                continue;
              }
              if (ch === "\"") {
                inString = !inString;
                continue;
              }
              if (!inString) {
                if (ch === "{") openBraces++;
                else if (ch === "}") openBraces = Math.max(0, openBraces - 1);
              }
            }

            if (escaped) {
              s = s.slice(0, -1);
            }
            if (inString) {
              s += "\"";
            }
            while (openBraces > 0) {
              s += "}";
              openBraces--;
            }

            return JSON.parse(s);
          }

          function extractJsonObject(text) {
            const cleaned = String(text || "")
              .replace(/^```json\s*/i, "")
              .replace(/^```\s*/i, "")
              .replace(/```\s*$/i, "")
              .trim();

            try {
              return JSON.parse(cleaned);
            } catch {
              const start = cleaned.indexOf("{");
              const end = cleaned.lastIndexOf("}");
              if (start !== -1 && end !== -1 && end > start) {
                try {
                  return JSON.parse(cleaned.slice(start, end + 1));
                } catch {
                  return tryRepairJson(cleaned);
                }
              }
              return tryRepairJson(cleaned);
            }
          }

          async function callChatCompletion(targetUrl, targetHeaders, payloadBody) {
            const cleanUrl = sanitizeUrl(targetUrl);
            const res = await fetch(cleanUrl, {
              method: "POST",
              headers: targetHeaders,
              body: JSON.stringify(payloadBody)
            });
            const txt = await res.text();
            let jsonData;
            try {
              jsonData = JSON.parse(txt);
            } catch {
              const err = new Error(`الرد ليس JSON صالحاً (HTTP ${res.status}): ${txt.slice(0, 350)}`);
              err.status = res.status;
              throw err;
            }
            if (!res.ok || jsonData.error) {
              const msg = jsonData?.error?.message || JSON.stringify(jsonData?.error || txt).slice(0, 350);
              const err = new Error(`HTTP ${res.status}: ${msg}`);
              err.status = res.status;
              throw err;
            }
            return jsonData;
          }

          async function callOpenRouterWithRetry(key, sysPrompt, usrPrompt, maxTokens, jsonMode = false) {
            const url = sanitizeUrl("[https://openrouter.ai/api/v1/chat/completions](https://openrouter.ai/api/v1/chat/completions)");
            const headers = {
              "Content-Type": "application/json",
              Authorization: `Bearer ${key}`,
              "HTTP-Referer": `[https://github.com/$](https://github.com/$){process.env.REPO}`,
              "X-Title": "sudan-market-autopilot"
            };
            const body = {
              model: "openrouter/free",
              messages: [
                { role: "system", content: sysPrompt },
                { role: "user", content: usrPrompt }
              ],
              max_tokens: maxTokens,
              temperature: 0.45
            };
            if (jsonMode) {
              body.response_format = { type: "json_object" };
            }

            let lastErr = null;
            for (let attempt = 1; attempt <= 2; attempt++) {
              try {
                const data = await callChatCompletion(url, headers, body);
                const out = data?.choices?.[0]?.message?.content || "";
                if (!out.trim()) {
                  throw new Error("رد فارغ من OpenRouter");
                }
                return out;
              } catch (e) {
                lastErr = e;
                if (attempt < 2) {
                  await new Promise(r => setTimeout(r, 1200));
                }
              }
            }
            throw lastErr || new Error("فشل OpenRouter");
          }

          function buildProviders(primaryKey, openRouterKey) {
            const list = [];
            const keys = [primaryKey, openRouterKey].filter(Boolean);
            const uniqueKeys = [...new Set(keys.map(k => k.trim()).filter(Boolean))];

            for (const key of uniqueKeys) {
              if (key.startsWith("gsk_")) {
                list.push({
                  id: "groq",
                  label: "Groq",
                  runText: async (sysPrompt, usrPrompt, maxTokens = 650) => {
                    const models = await getGroqModelsOrdered(key);
                    const groqUrl = sanitizeUrl("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)");
                    const headers = {
                      "Content-Type": "application/json",
                      Authorization: `Bearer ${key}`
                    };
                    let lastErr = null;
                    for (const m of models) {
                      try {
                        const data = await callChatCompletion(groqUrl, headers, {
                          model: m,
                          messages: [
                            { role: "system", content: sysPrompt },
                            { role: "user", content: usrPrompt }
                          ],
                          max_tokens: maxTokens,
                          temperature: 0.45
                        });
                        const out = data?.choices?.[0]?.message?.content || "";
                        if (!out.trim()) throw new Error("رد فارغ");
                        return { text: out, detail: `Groq (${m})` };
                      } catch (e) {
                        lastErr = e;
                        if (e.status === 429 || e.status === 400) continue;
                      }
                    }
                    throw lastErr || new Error("فشل جميع نماذج Groq");
                  },
                  runJson: async (sysPrompt, usrPrompt, maxTokens = 2600) => {
                    const models = await getGroqModelsOrdered(key);
                    const groqUrl = sanitizeUrl("[https://api.groq.com/openai/v1/chat/completions](https://api.groq.com/openai/v1/chat/completions)");
                    const headers = {
                      "Content-Type": "application/json",
                      Authorization: `Bearer ${key}`
                    };
                    let lastErr = null;
                    for (const m of models) {
                      try {
                        let data;
                        try {
                          data = await callChatCompletion(groqUrl, headers, {
                            model: m,
                            messages: [
                              { role: "system", content: sysPrompt },
                              { role: "user", content: usrPrompt }
                            ],
                            response_format: { type: "json_object" },
                            max_tokens: maxTokens,
                            temperature: 0.45
                          });
                        } catch (jErr) {
                          if (jErr.status === 429) throw jErr;
                          data = await callChatCompletion(groqUrl, headers, {
                            model: m,
                            messages: [
                              { role: "system", content: sysPrompt },
                              { role: "user", content: usrPrompt }
                            ],
                            max_tokens: maxTokens,
                            temperature: 0.45
                          });
                        }
                        const raw = data?.choices?.[0]?.message?.content || "";
                        if (!raw.trim()) throw new Error("رد فارغ");
                        return { parsed: extractJsonObject(raw), detail: `Groq (${m})` };
                      } catch (e) {
                        lastErr = e;
                        if (e.status === 429 || e.status === 400) continue;
                      }
                    }
                    throw lastErr || new Error("فشل توليد JSON من Groq");
                  }
                });
              } else if (key.startsWith("sk-or-")) {
                list.push({
                  id: "openrouter",
                  label: "OpenRouter (ChatGPT-style assistant)",
                  runText: async (sysPrompt, usrPrompt, maxTokens = 650) => {
                    const out = await callOpenRouterWithRetry(key, sysPrompt, usrPrompt, maxTokens, false);
                    return { text: out, detail: "OpenRouter (openrouter/free)" };
                  },
                  runJson: async (sysPrompt, usrPrompt, maxTokens = 2600) => {
                    const raw = await callOpenRouterWithRetry(key, sysPrompt, usrPrompt, maxTokens, false);
                    return { parsed: extractJsonObject(raw), detail: "OpenRouter (openrouter/free)" };
                  }
                });
              } else {
                list.push({
                  id: "gemini",
                  label: "Gemini",
                  runText: async (sysPrompt, usrPrompt, maxTokens = 650) => {
                    const url = sanitizeUrl(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$){encodeURIComponent(key)}`);
                    const data = await callChatCompletion(
                      url,
                      { "Content-Type": "application/json" },
                      {
                        systemInstruction: { parts: [{ text: sysPrompt }] },
                        contents: [{ parts: [{ text: usrPrompt }] }],
                        generationConfig: { maxOutputTokens: maxTokens, temperature: 0.45 }
                      }
                    );
                    const out = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    if (!out.trim()) throw new Error("رد فارغ من Gemini");
                    return { text: out, detail: "Gemini (gemini-2.5-flash)" };
                  },
                  runJson: async (sysPrompt, usrPrompt, maxTokens = 2600) => {
                    const url = sanitizeUrl(`[https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$](https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$){encodeURIComponent(key)}`);
                    const data = await callChatCompletion(
                      url,
                      { "Content-Type": "application/json" },
                      {
                        systemInstruction: { parts: [{ text: sysPrompt }] },
                        contents: [{ parts: [{ text: usrPrompt }] }],
                        generationConfig: {
                          responseMimeType: "application/json",
                          maxOutputTokens: maxTokens,
                          temperature: 0.45
                        }
                      }
                    );
                    const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || "";
                    if (!raw.trim()) throw new Error("رد فارغ من Gemini");
                    return { parsed: extractJsonObject(raw), detail: "Gemini (gemini-2.5-flash)" };
                  }
                });
              }
            }
            return list;
          }

          async function run() {
            const primaryKey = (process.env.AI_API_KEY || "").trim();
            const openRouterKey = (process.env.OPENROUTER_API_KEY || "").trim();
            const providers = buildProviders(primaryKey, openRouterKey);

            if (!providers.length) {
              failWithReason("لا يوجد أي مفتاح API صالح في GitHub Secrets (AI_API_KEY أو OPENROUTER_API_KEY).");
            }

            let actionsErrorLogs = "";
            try {
              const runsUrl = sanitizeUrl(`[https://api.github.com/repos/$](https://api.github.com/repos/$){process.env.REPO}/actions/runs?per_page=5`);
              const runsRes = await fetch(runsUrl, {
                headers: {
                  Authorization: `Bearer ${process.env.GH_TOKEN}`,
                  "User-Agent": "ai-autopilot"
                }
              });
              if (runsRes.ok) {
                const runsData = await runsRes.json();
                const failedRun = (runsData.workflow_runs || []).find(
                  r => r.conclusion === "failure" && r.name !== "AI Auto Fix & Feature Updater"
                );
                if (failedRun) {
                  const jobsRes = await fetch(sanitizeUrl(failedRun.jobs_url), {
                    headers: {
                      Authorization: `Bearer ${process.env.GH_TOKEN}`,
                      "User-Agent": "ai-autopilot"
                    }
                  });
                  if (jobsRes.ok) {
                    const jobsData = await jobsRes.json();
                    actionsErrorLogs = JSON.stringify(
                      jobsData.jobs.map(j => ({ name: j.name, conclusion: j.conclusion, steps: j.steps })),
                      null,
                      2
                    ).slice(0, 1400);
                  }
                }
              }
            } catch (e) {
              actionsErrorLogs = "تعذر جلب سجلات GitHub Actions: " + e.message;
            }

            const filesList = collectProjectFiles(".");
            const currentFiles = filesList
              .map(f => `--- FILE: ${f.fullPath} ---\n${f.content}`)
              .join("\n\n")
              .slice(0, 5500);

            const coreRules = [
              "1) دور Render والحفظ في المتصفح: Render يعمل كجسر بث مباشر (WebSocket relay) فقط لإرسال ما يكتبه المستخدم للجميع وتوصيل الآخرين دون تخزين ثقيل على الخادم، بينما يتم الحفظ في متصفح المستخدم عبر localStorage مع مسارات نسبية تعمل بسلاسة من رابط GitHub Pages.",
              "2) ظهور كل تطوير مباشرة في الموقع: أي ميزة أو تحسين يجب أن يظهر بوضوح وفعالية مباشرة في واجهة index.html وملفات public/ في نفس التحديث.",
              "3) إصلاح الأعطال أولاً: إذا وُجد أي خطأ يمنع التشغيل أو العرض، أصلحه أولاً.",
              "4) جوهر المشروع وأفكار مبتكرة بلا حشو: اكتشاف المتاجر أو المناطق الرخيصة مقارنة بالغالية بأفكار ذكية ومرتبة ومعيارية في ملف واحد صغير أو ملفين بدون حشو أو نصوص مكررة."
            ].join("\n");

            let agreedPlan = "";
            let activeExecutor = null;

            if (providers.length >= 2) {
              const p1 = providers[0];
              const p2 = providers[1];
              console.log(`🤝 وضع الحوار والاتفاق نشط بين: [${p1.label}] و [${p2.label}]`);

              let proposalText = "";
              try {
                const propRes = await p1.runText(
                  "أنت المخطط الأول. اكتب مقترحاً مختصراً وعملياً ومبتكراً في 3 نقاط قصيرة فقط.",
                  `${coreRules}\n\nالسجلات:\n${actionsErrorLogs || "لا توجد أخطاء"}\n\nالملفات:\n${currentFiles}`,
                  550
                );
                proposalText = propRes.text;
                console.log(`💡 مقترح ${propRes.detail} جاهز للمراجعة.`);

                try {
                  const revRes = await p2.runText(
                    "أنت المراجع والمفاوض الثاني بأسلوب حواري واضح وعملي. راجع المقترح باختصار ثم اكتب [اتفقنا] متبوعاً بالخطة النهائية المختصرة للتنفيذ.",
                    `مقترح الطرف الأول:\n${proposalText}\n\n${coreRules}`,
                    550
                  );
                  agreedPlan = revRes.text;
                  activeExecutor = p2;
                  console.log(`✅ تم الاتفاق بين الطرفين عبر ${revRes.detail}.`);
                } catch (revErr) {
                  console.warn(`⚠️ الطرف الثاني غير متاح حالياً (${revErr.message}) — يكمل الطرف الأول التنفيذ مباشرة دون تعطيل.`);
                  agreedPlan = `[اتفاق مباشر]\n${proposalText}`;
                  activeExecutor = p1;
                }
              } catch (propErr) {
                console.warn(`⚠️ الطرف الأول غير متاح حالياً (${propErr.message}) — ينتقل الطرف الثاني للعمل المستقل فوراً دون حوار أو استشارة.`);
                const soloRes = await p2.runText(
                  "أنت المنفذ المستقل. ضع خطة سريعة ومباشرة في 3 نقاط قصيرة لتطوير المشروع.",
                  `${coreRules}\n\nالسجلات:\n${actionsErrorLogs || "لا توجد أخطاء"}\n\nالملفات:\n${currentFiles}`,
                  550
                );
                agreedPlan = `[عمل مستقل فوري]\n${soloRes.text}`;
                activeExecutor = p2;
              }
            } else {
              const solo = providers[0];
              console.log(`⚡ وضع العمل المستقل عبر: ${solo.label}`);
              agreedPlan = "نفّذ أفضل تطوير مبتكر ومباشر للمشروع وفق القواعد المحددة.";
              activeExecutor = solo;
            }

            const systemJsonInstruction = [
              "أنت مهندس برمجيات ومصمم واجهات ذكي.",
              "أعد كائن JSON صالحاً فقط بدون أي نص خارج JSON، وبصيغة الهروب الصحيحة للأسطر الجديدة وعلامات التنصيص داخل السلاسل النصية.",
              "الشكل المطلوب بدقة: {\"files\":{\"مسار_الملف\":\"محتواه_الكامل\"},\"summary\":\"ملخص واضح ومختصر\"}"
            ].join("\n");

            const executionPrompt = [
              "نفّذ الخطة التالية باختصار وإتقان وحدث ملفاً واحداً صغيراً أو ملفين فقط لضمان اكتمال JSON:",
              agreedPlan,
              "",
              coreRules,
              "",
              "=== CURRENT FILES ===",
              currentFiles
            ].join("\n");

            let execResult = null;
            const orderedExecutors = [
              activeExecutor,
              ...providers.filter(pr => pr !== activeExecutor)
            ].filter(Boolean);

            let lastExecErr = null;
            for (const execProvider of orderedExecutors) {
              try {
                execResult = await execProvider.runJson(systemJsonInstruction, executionPrompt, 2600);
                lastExecErr = null;
                break;
              } catch (e) {
                lastExecErr = e;
                console.warn(`⚠️ تعذر التنفيذ عبر ${execProvider.label} (${e.message}) — انتقال فوري للمزود التالي دون استشارة.`);
              }
            }

            if (!execResult || !execResult.parsed) {
              failWithReason(`تعذر إكمال التوليد من جميع المزودين المتاحين: ${lastExecErr ? lastExecErr.message : "خطأ غير معروف"}`);
            }

            const parsed = execResult.parsed;
            console.log(`✅ AI STATUS: WORKING (${execResult.detail})`);
            console.log("ملخص التحديث:", parsed.summary || "تم التطوير والفحص");

            let updatedCount = 0;
            if (parsed.files && typeof parsed.files === "object") {
              for (const [filePath, content] of Object.entries(parsed.files)) {
                const cleanPath = String(filePath).replace(/^\/+/, "").trim();
                if (!cleanPath || cleanPath.includes("..") || typeof content !== "string" || !content.trim()) {
                  continue;
                }
                if (cleanPath.endsWith(".json")) {
                  try {
                    JSON.parse(content);
                  } catch {
                    console.warn(`⚠️ تم تخطي ${cleanPath} لأن محتواه JSON غير صالح.`);
                    continue;
                  }
                }
                const dirName = path.dirname(cleanPath);
                if (dirName && dirName !== ".") {
                  fs.mkdirSync(dirName, { recursive: true });
                }
                const prevContent = fs.existsSync(cleanPath) ? fs.readFileSync(cleanPath, "utf8") : "";
                if (prevContent !== content) {
                  fs.writeFileSync(cleanPath, content, "utf8");
                  updatedCount++;
                  console.log(`📝 تم تحديث/إنشاء الملف: ${cleanPath}`);
                }
              }
            }

            console.log(`عدد الملفات التي تغيّر محتواها: ${updatedCount}`);
            if (updatedCount > 0) {
              fs.writeFileSync("last_ai_change.txt", String(parsed.summary || "Collaborative autonomous update").replace(/[\r\n]+/g, " ").slice(0, 120), "utf8");
            }
          }

          run();
          '

      - name: Commit and push changes automatically
        run: |
          git config user.name "ai-autopilot[bot]"
          git config user.email "ai-autopilot[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            rm -f last_ai_change.txt
            echo "ℹ️ nothing to commit, working tree clean — لا توجد تغييرات جديدة."
            exit 0
          fi
          SUMMARY="Collaborative autonomous update"
          if [ -f last_ai_change.txt ]; then
            SUMMARY=$(head -n 1 last_ai_change.txt)
            rm -f last_ai_change.txt
            git add -A
          fi
          if git diff --staged --quiet; then
            echo "ℹ️ لا توجد تغييرات متبقية بعد تنظيف الملف المؤقت."
            exit 0
          fi
          git commit -m "[ai-autopilot] ${SUMMARY}"
          git push origin HEAD
          echo "✅ PUSH STATUS: تم رفع التعديلات إلى GitHub بنجاح."
