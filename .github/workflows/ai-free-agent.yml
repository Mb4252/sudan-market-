name: AI Free Agent

on:
  schedule:
    # يعمل كل يوم الساعة 3 صباحاً
    - cron: '0 3 * * *'
  workflow_dispatch:
    # أو يدوياً من تبويب Actions

permissions:
  contents: write
  pull-requests: write

jobs:
  free-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Qwen Code Agent (Free Mode)
        uses: qwenlm/qwen-code-action@v1
        with:
          qwen_api_key: ${{ secrets.QWEN_API_KEY }}
          prompt: |
            أنت وكيل برمجة حر تعمل على مشروع "رادار أسعار الحي".
            اقرأ ملف index.html بالكامل.
            حلل الكود وابحث عن فرص للتحسين أو الإضافة.
            أضف ميزة جديدة واحدة مفيدة، أو حسّن أداءً، أو أصلح خطأً محتملاً.
            لا تحذف أي وظيفة موجودة.
            حافظ على التصميم والألوان والخط الحالي.
            بعد الانتهاء، اكتب commit message واضحاً.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
